<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      padding: 24px;
      text-align: center;
    }

    #start-screen h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #start-screen p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .select-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .beam-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .beam-card:active { transform: scale(0.96); }
    .beam-card.red { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    .beam-card.blue { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    .beam-card.green { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    #selection-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      cursor: crosshair;
    }

    #ui-container {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      pointer-events: none;
    }

    .title-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-tag span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    #status {
      color: #e2e8f0;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }

    .panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.nav-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.nav-btn.active {
      background: #3b82f6;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-screen">
    <h1>Everyone AR Beam</h1>
    <p>ビームのタイプを選択してください</p>
    
    <div class="select-grid">
      <div class="beam-card red" onclick="startApp('red')">
        <span>🔴 レッドレーザー</span>
        <span>▶</span>
      </div>
      <div class="beam-card blue" onclick="startApp('blue')">
        <span>⚡ プラズマブルー</span>
        <span>▶</span>
      </div>
      <div class="beam-card green" onclick="startApp('green')">
        <span>🟢 プラズマグリーン</span>
        <span>▶</span>
      </div>
    </div>
  </div>

  <div class="title-tag">
    <span></span> ARマルチビーム実行中
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>
  <canvas id="selection-canvas"></canvas>

  <div id="ui-container">
    <div id="status">カメラ準備中...</div>
    <div class="panel">
      <button id="mode-btn" class="nav-btn" onclick="toggleMode()">🖱 物体認識モード切替</button>
      <button id="clear-btn" class="nav-btn" style="display:none;" onclick="clearCustomTargets()">🗑 追従リセット</button>
      <button class="nav-btn" onclick="backToMenu()">⚙ ビーム変更</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    let currentFacingMode = 'user';
    let cameraInstance = null;
    let activeBeamType = 'red';
    let trackingMode = 'hand';
    let audioCtx = null, beamSoundNode = null, beamGainNode = null;

    const MAX_BEAMS = 5;
    const beamPool = [];

    const beamStyles = {
      red:   { color: 0xff1100, coreColor: 0xffffff, pitch: 300 },
      blue:  { color: 0x00d2ff, coreColor: 0xe0ffff, pitch: 450 },
      green: { color: 0x00ff66, coreColor: 0xffffff, pitch: 220 }
    };

    const statusEl = document.getElementById('status');
    const videoElement = document.getElementById('webcam');
    const startScreen = document.getElementById('start-screen');

    // 画像処理用キャンバス
    const processCanvas = document.createElement('canvas');
    const processCtx = processCanvas.getContext('2d');

    // --------------------------------------------------
    // オーディオ（効果音）
    // --------------------------------------------------
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startBeamSound() {
      initAudio();
      if (beamSoundNode) return;
      const style = beamStyles[activeBeamType];
      beamSoundNode = audioCtx.createOscillator();
      beamGainNode = audioCtx.createGain();
      beamSoundNode.type = 'sawtooth';
      beamSoundNode.frequency.setValueAtTime(style.pitch, audioCtx.currentTime);
      beamGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
      beamGainNode.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);
      beamSoundNode.connect(beamGainNode);
      beamGainNode.connect(audioCtx.destination);
      beamSoundNode.start();
    }

    function stopBeamSound() {
      if (beamSoundNode && beamGainNode) {
        beamGainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => {
          if (beamSoundNode) {
            beamSoundNode.stop();
            beamSoundNode.disconnect();
            beamSoundNode = null;
            beamGainNode = null;
          }
        }, 100);
      }
    }

    // --------------------------------------------------
    // Three.js (複数ビーム生成 & 描画)
    // --------------------------------------------------
    const canvas3d = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3d.position.z = 5;

    function createSingleBeamGroup() {
      const group = new THREE.Group();

      // 円柱ジオメトリ（指先から奥方向へ向かって作成）
      const outerGeo = new THREE.CylinderGeometry(0.04, 0.008, 10, 16);
      outerGeo.rotateX(-Math.PI / 2); // 角度補正：前方（Z軸のマイナス方向）へ向ける
      outerGeo.translate(0, 0, -5);

      const outerMat = new THREE.MeshBasicMaterial({ color: 0xff1100, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);

      const innerGeo = new THREE.CylinderGeometry(0.015, 0.003, 10, 16);
      innerGeo.rotateX(-Math.PI / 2);
      innerGeo.translate(0, 0, -5);

      const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);

      const ringGeo = new THREE.RingGeometry(0.03, 0.06, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);

      group.add(outerMesh);
      group.add(innerMesh);
      group.add(ringMesh);
      group.visible = false;

      return { group, outerMat, innerMat, ringMat, ringMesh };
    }

    for (let i = 0; i < MAX_BEAMS; i++) {
      const beamObj = createSingleBeamGroup();
      beamPool.push(beamObj);
      scene.add(beamObj.group);
    }

    function applyBeamStyle(type) {
      activeBeamType = type;
      const style = beamStyles[type];
      beamPool.forEach(b => {
        b.outerMat.color.setHex(style.color);
        b.innerMat.color.setHex(style.coreColor);
        b.ringMat.color.setHex(style.color);
      });
    }

    function hideAllBeams() {
      beamPool.forEach(b => b.group.visible = false);
    }

    // --------------------------------------------------
    // ドラッグ囲み & リアルタイム物体追従（トラッキング）
    // --------------------------------------------------
    const selectionCanvas = document.getElementById('selection-canvas');
    const ctxSelect = selectionCanvas.getContext('2d');
    selectionCanvas.width = window.innerWidth;
    selectionCanvas.height = window.innerHeight;

    let isDrawing = false;
    let pathPoints = [];
    let trackedObjects = [];

    selectionCanvas.addEventListener('mousedown', startDraw);
    selectionCanvas.addEventListener('mousemove', draw);
    selectionCanvas.addEventListener('mouseup', endDraw);
    selectionCanvas.addEventListener('touchstart', (e) => startDraw(e.touches[0]));
    selectionCanvas.addEventListener('touchmove', (e) => draw(e.touches[0]));
    selectionCanvas.addEventListener('touchend', endDraw);

    function startDraw(e) {
      if (trackingMode !== 'custom') return;
      isDrawing = true;
      pathPoints = [{ x: e.clientX, y: e.clientY }];
    }

    function draw(e) {
      if (!isDrawing || trackingMode !== 'custom') return;
      pathPoints.push({ x: e.clientX, y: e.clientY });

      ctxSelect.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      ctxSelect.strokeStyle = '#60a5fa';
      ctxSelect.lineWidth = 3;
      ctxSelect.setLineDash([6, 6]);
      ctxSelect.beginPath();
      ctxSelect.moveTo(pathPoints[0].x, pathPoints[0].y);
      for (let i = 1; i < pathPoints.length; i++) {
        ctxSelect.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
      ctxSelect.stroke();
    }

    function endDraw() {
      if (!isDrawing || trackingMode !== 'custom') return;
      isDrawing = false;
      ctxSelect.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);

      if (pathPoints.length > 3 && videoElement.videoWidth) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pathPoints.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });

        const vw = videoElement.videoWidth;
        const vh = videoElement.videoHeight;
        processCanvas.width = vw;
        processCanvas.height = vh;
        
        processCtx.save();
        if (currentFacingMode === 'user') {
          processCtx.translate(vw, 0);
          processCtx.scale(-1, 1);
        }
        processCtx.drawImage(videoElement, 0, 0, vw, vh);
        processCtx.restore();

        const scaleX = vw / window.innerWidth;
        const scaleY = vh / window.innerHeight;

        const vx = Math.floor(minX * scaleX);
        const vy = Math.floor(minY * scaleY);
        const vwBox = Math.max(10, Math.floor((maxX - minX) * scaleX));
        const vhBox = Math.max(10, Math.floor((maxY - minY) * scaleY));

        const imgData = processCtx.getImageData(vx, vy, vwBox, vhBox);
        const targetRGB = getAverageRGB(imgData.data);

        trackedObjects.push({
          x: (minX + maxX) / 2,
          y: (minY + maxY) / 2,
          targetRGB: targetRGB
        });

        statusEl.textContent = `🎯 オブジェクトを登録！リアルタイム追従中 (${trackedObjects.length}個)`;
      }
    }

    function getAverageRGB(data) {
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 16) {
        r += data[i];
        g += data[i+1];
        b += data[i+2];
        count++;
      }
      return { r: r / count, g: g / count, b: b / count };
    }

    // カメラフレーム内から登録された色・特徴を探索して追従
    function updateObjectTracking() {
      if (trackedObjects.length === 0 || !videoElement.videoWidth) return;

      const vw = videoElement.videoWidth;
      const vh = videoElement.videoHeight;
      processCanvas.width = 160; 
      processCanvas.height = 120;

      processCtx.save();
      if (currentFacingMode === 'user') {
        processCtx.translate(160, 0);
        processCtx.scale(-1, 1);
      }
      processCtx.drawImage(videoElement, 0, 0, 160, 120);
      processCtx.restore();

      const frameData = processCtx.getImageData(0, 0, 160, 120).data;

      trackedObjects.forEach((obj) => {
        let bestX = obj.x;
        let bestY = obj.y;
        let minDiff = Infinity;

        const currentNormX = obj.x / window.innerWidth;
        const currentNormY = obj.y / window.innerHeight;

        const searchRadius = 0.25; 
        const minI = Math.max(0, Math.floor((currentNormY - searchRadius) * 120));
        const maxI = Math.min(120, Math.ceil((currentNormY + searchRadius) * 120));
        const minJ = Math.max(0, Math.floor((currentNormX - searchRadius) * 160));
        const maxJ = Math.min(160, Math.ceil((currentNormX + searchRadius) * 160));

        for (let i = minI; i < maxI; i += 2) {
          for (let j = minJ; j < maxJ; j += 2) {
            const idx = (i * 160 + j) * 4;
            const r = frameData[idx];
            const g = frameData[idx+1];
            const b = frameData[idx+2];

            const diff = Math.abs(r - obj.targetRGB.r) + Math.abs(g - obj.targetRGB.g) + Math.abs(b - obj.targetRGB.b);
            if (diff < minDiff) {
              minDiff = diff;
              bestX = (j / 160) * window.innerWidth;
              bestY = (i / 120) * window.innerHeight;
            }
          }
        }

        // スムーズに追従移動
        obj.x += (bestX - obj.x) * 0.3;
        obj.y += (bestY - obj.y) * 0.3;
      });
    }

    function clearCustomTargets() {
      trackedObjects = [];
      hideAllBeams();
      stopBeamSound();
      statusEl.textContent = '追従をリセットしました。追従したい物を画面上で囲んでください';
    }

    function toggleMode() {
      trackingMode = (trackingMode === 'hand') ? 'custom' : 'hand';
      const modeBtn = document.getElementById('mode-btn');
      const clearBtn = document.getElementById('clear-btn');
      
      if (trackingMode === 'custom') {
        modeBtn.classList.add('active');
        clearBtn.style.display = 'inline-block';
        statusEl.textContent = 'カメラに映る物（指・ペンなど）をドラッグで囲むと自動追従します';
        hideAllBeams();
        stopBeamSound();
      } else {
        modeBtn.classList.remove('active');
        clearBtn.style.display = 'none';
        statusEl.textContent = '手の認識モード（指先から前方へビーム発射）';
      }
    }

    // --------------------------------------------------
    // MediaPipe Hands (複数指先認識 & ビーム向き設定)
    // --------------------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    const fingerPairs = [
      { tip: 8,  dip: 6 },  // 人差し指
      { tip: 12, dip: 10 }, // 中指
      { tip: 16, dip: 14 }  // 薬指
    ];

    hands.onResults((results) => {
      hideAllBeams();

      // 物体追従モード
      if (trackingMode === 'custom') {
        updateObjectTracking();
        if (trackedObjects.length > 0) {
          trackedObjects.forEach((obj, idx) => {
            if (idx < MAX_BEAMS) {
              const normX = (obj.x / window.innerWidth) * 2 - 1;
              const normY = -(obj.y / window.innerHeight) * 2 + 1;
              const aspect = window.innerWidth / window.innerHeight;

              const posX = normX * 2 * aspect;
              const posY = normY * 2;
              const posZ = -1;

              const b = beamPool[idx];
              b.group.position.set(posX, posY, posZ);
              b.group.lookAt(posX, posY, posZ - 10);
              b.group.visible = true;
            }
          });
          startBeamSound();
        } else {
          stopBeamSound();
        }
        return;
      }

      // 手指認識モード
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const isUser = (currentFacingMode === 'user');
        const aspect = window.innerWidth / window.innerHeight;
        let activeCount = 0;

        fingerPairs.forEach((finger, idx) => {
          const tip = landmarks[finger.tip];
          const dip = landmarks[finger.dip];

          const rawTipX = isUser ? (1 - tip.x) : tip.x;
          const rawDipX = isUser ? (1 - dip.x) : dip.x;

          const tipX = (rawTipX - 0.5) * 4 * aspect;
          const tipY = (0.5 - tip.y) * 4;
          const tipZ = -tip.z * 4;

          const dipX = (rawDipX - 0.5) * 4 * aspect;
          const dipY = (0.5 - dip.y) * 4;
          const dipZ = -dip.z * 4;

          const b = beamPool[idx];
          b.group.position.set(tipX, tipY, tipZ);

          // ★修正: 第一関節(dip) -> 指先(tip)のベクトルで「指先から外へ」向ける
          const dir = new THREE.Vector3(tipX - dipX, tipY - dipY, tipZ - dipZ).normalize();
          const targetPos = new THREE.Vector3().addVectors(b.group.position, dir);
          b.group.lookAt(targetPos);

          b.group.visible = true;
          activeCount++;
        });

        statusEl.textContent = `指先を認識中 ⚡ (${activeCount}本 前方へ発射中)`;
        startBeamSound();
      } else {
        statusEl.textContent = 'カメラに手をかざすか、物体認識モードをお試しください';
        stopBeamSound();
      }
    });

    // --------------------------------------------------
    // アプリ・カメラ制御
    // --------------------------------------------------
    function startApp(beamType) {
      applyBeamStyle(beamType);
      startScreen.style.display = 'none';
      initAudio();
      startCamera(currentFacingMode);
    }

    function backToMenu() {
      if (cameraInstance) cameraInstance.stop();
      hideAllBeams();
      stopBeamSound();
      startScreen.style.display = 'flex';
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: facingMode
      });

      cameraInstance.start().then(() => {
        statusEl.textContent = 'カメラ準備完了！手をかざすか物体認識モードを選択してください';
      }).catch((err) => {
        statusEl.textContent = 'カメラ読込失敗: ' + err.message;
      });
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.015;
      beamPool.forEach(b => {
        if (b.group.visible) {
          b.outerMat.opacity = 0.5 + Math.sin(time) * 0.2;
          b.ringMesh.rotation.z += 0.05;
        }
      });
      renderer.render(scene, camera3d);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      selectionCanvas.width = window.innerWidth;
      selectionCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
