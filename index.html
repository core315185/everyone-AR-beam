<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - High Tracking Performance</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
      pointer-events: none;
    }

    #canvas2d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas2d"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">画面上の人や物をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
      <button class="nav-btn" id="cam-btn">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas = document.getElementById('canvas2d');
    const ctx = canvas.getContext('2d');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    let currentFacingMode = 'environment';
    let cameraStream = null;
    let activeBeams = [];

    const PROC_W = 320;
    const PROC_H = 240;
    const TEMP_SIZE = 24; // テンプレートサイズ

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      resizeCanvas();
      startCamera(currentFacingMode);
      animate();
    });

    function calculateOrigin(targetX, targetY) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const angle = Math.atan2(targetY - h / 2, targetX - w / 2) + (Math.random() - 0.5) * 1.2;
      const length = Math.max(w, h) * 1.2;

      return {
        x: targetX - Math.cos(angle) * length,
        y: targetY - Math.sin(angle) * length
      };
    }

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      let templateData = null;
      let videoX = 0, videoY = 0;

      if (videoElement.readyState >= 2) {
        try {
          processCanvas.width = PROC_W;
          processCanvas.height = PROC_H;
          pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
          
          videoX = (clientX / window.innerWidth) * PROC_W;
          videoY = (clientY / window.innerHeight) * PROC_H;

          const startX = Math.max(0, Math.min(PROC_W - TEMP_SIZE, videoX - TEMP_SIZE / 2));
          const startY = Math.max(0, Math.min(PROC_H - TEMP_SIZE, videoY - TEMP_SIZE / 2));

          templateData = pCtx.getImageData(startX, startY, TEMP_SIZE, TEMP_SIZE);
        } catch (err) {
          console.warn("Template extraction error:", err);
        }
      }

      const origin = calculateOrigin(clientX, clientY);

      activeBeams.push({
        originX: origin.x,
        originY: origin.y,
        x: clientX,
        y: clientY,
        smoothX: clientX,
        smoothY: clientY,
        videoX: videoX,
        videoY: videoY,
        template: templateData
      });

      statusEl.textContent = `⚡ ロックオン完了！ (合計: ${activeBeams.length}本)`;
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        activeBeams.pop();
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    document.getElementById('cam-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    });

    // 高速・広範囲トラッキング（粗検索＋詳細検索の2段階）
    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      try {
        processCanvas.width = PROC_W;
        processCanvas.height = PROC_H;
        pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
        const frame = pCtx.getImageData(0, 0, PROC_W, PROC_H);

        activeBeams.forEach(beam => {
          if (!beam.template) return;

          const tData = beam.template.data;
          let bestX = beam.videoX;
          let bestY = beam.videoY;
          let minDiff = Infinity;

          // 1階層目: 広範囲粗検索 (ステップ: 6px, 範囲: ±42px)
          const searchRadius1 = 42;
          const step1 = 6;

          for (let dy = -searchRadius1; dy <= searchRadius1; dy += step1) {
            for (let dx = -searchRadius1; dx <= searchRadius1; dx += step1) {
              const curX = Math.floor(beam.videoX + dx);
              const curY = Math.floor(beam.videoY + dy);

              if (curX < 0 || curX >= PROC_W - TEMP_SIZE || curY < 0 || curY >= PROC_H - TEMP_SIZE) continue;

              let diff = 0;
              // 4ピクセル飛ばしで比較計算を高速化
              for (let i = 0; i < tData.length; i += 16) {
                const px = (i / 4) % TEMP_SIZE;
                const py = Math.floor((i / 4) / TEMP_SIZE);
                const fIdx = ((curY + py) * PROC_W + (curX + px)) * 4;

                diff += Math.abs(frame.data[fIdx] - tData[i]) +
                        Math.abs(frame.data[fIdx + 1] - tData[i + 1]) +
                        Math.abs(frame.data[fIdx + 2] - tData[i + 2]);
              }

              if (diff < minDiff) {
                minDiff = diff;
                bestX = curX;
                bestY = curY;
              }
            }
          }

          // 2階層目: 近傍精密検索 (ステップ: 2px, 範囲: ±8px)
          let fineX = bestX;
          let fineY = bestY;
          let fineMinDiff = Infinity;
          const searchRadius2 = 8;
          const step2 = 2;

          for (let dy = -searchRadius2; dy <= searchRadius2; dy += step2) {
            for (let dx = -searchRadius2; dx <= searchRadius2; dx += step2) {
              const curX = Math.floor(bestX + dx);
              const curY = Math.floor(bestY + dy);

              if (curX < 0 || curX >= PROC_W - TEMP_SIZE || curY < 0 || curY >= PROC_H - TEMP_SIZE) continue;

              let diff = 0;
              for (let i = 0; i < tData.length; i += 8) {
                const px = (i / 4) % TEMP_SIZE;
                const py = Math.floor((i / 4) / TEMP_SIZE);
                const fIdx = ((curY + py) * PROC_W + (curX + px)) * 4;

                diff += Math.abs(frame.data[fIdx] - tData[i]) +
                        Math.abs(frame.data[fIdx + 1] - tData[i + 1]) +
                        Math.abs(frame.data[fIdx + 2] - tData[i + 2]);
              }

              if (diff < fineMinDiff) {
                fineMinDiff = diff;
                fineX = curX;
                fineY = curY;
              }
            }
          }

          // テンプレート更新（少しずつ変化する被写体に適応するオンライン学習）
          if (fineMinDiff < 35000) {
            beam.videoX = fineX;
            beam.videoY = fineY;
            beam.x = (fineX / PROC_W) * window.innerWidth;
            beam.y = (fineY / PROC_H) * window.innerHeight;

            // テンプレートを最新画像でわずかに追従更新 (漂流防止つき)
            const newTemp = pCtx.getImageData(fineX, fineY, TEMP_SIZE, TEMP_SIZE);
            for (let i = 0; i < tData.length; i += 4) {
              tData[i] = Math.round(tData[i] * 0.9 + newTemp.data[i] * 0.1);
              tData[i+1] = Math.round(tData[i+1] * 0.9 + newTemp.data[i+1] * 0.1);
              tData[i+2] = Math.round(tData[i+2] * 0.9 + newTemp.data[i+2] * 0.1);
            }
          }
        });
      } catch (err) {}
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      trackObjects();

      activeBeams.forEach((beam) => {
        // スムージング係数を0.25➔0.45に引き上げてレスポンス・追従スピードをアップ
        beam.smoothX += (beam.x - beam.smoothX) * 0.45;
        beam.smoothY += (beam.y - beam.smoothY) * 0.45;

        const startX = beam.originX;
        const startY = beam.originY;
        const targetX = beam.smoothX;
        const targetY = beam.smoothY;

        // 1. ビーム外光
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.85)';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.restore();

        // 2. ビーム芯
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // 3. 照準マーカー
        ctx.save();
        ctx.beginPath();
        ctx.arc(targetX, targetY, 20 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 12;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }
  </script>
</body>
</html>
