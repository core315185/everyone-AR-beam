<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - MediaPipe Hands Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands (ハンドトラッキングAI) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">🖐️ MediaPipe 手の認識 ARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>

  <div id="ui-container">
    <div id="status">カメラに手をかざして、指先をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');

    let cameraStream = null;
    let activeBeams = [];

    let scene, camera, renderer;
    const Z_PLANE = -10;

    // MediaPipe Hands インスタンス
    let handsDetector = null;
    let latestHandLandmarks = [];
    let isHandsProcessing = false;

    function initAI() {
      handsDetector = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      handsDetector.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      handsDetector.onResults((results) => {
        latestHandLandmarks = results.multiHandLandmarks || [];
        isHandsProcessing = false;
      });
    }

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    function create3DBeamElements() {
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const outerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1, 12, 1, true), outerMat);
      scene.add(outerMesh);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const innerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1, 8, 1, true), innerMat);
      scene.add(innerMesh);

      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const ringMesh = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 24), ringMat);
      scene.add(ringMesh);

      const pCount = 15;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];
      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.08, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      scene.add(particleSystem);

      return { outerMesh, innerMesh, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      initAI();
      init3D();
      startCamera();
      animate();
    });

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      const normX = clientX / window.innerWidth;
      const normY = clientY / window.innerHeight;
      
      let matchedLandmarks = null;
      let targetLandmarkIndex = 8; // デフォルト：人差し指の先端 (ランドマーク8)

      // タップ位置周辺の手のランドマークを探索
      if (latestHandLandmarks.length > 0) {
        let minDist = 0.3;
        latestHandLandmarks.forEach(landmarks => {
          // 主要な指先 (4:親指, 8:人差し指, 12:中指, 16:薬指, 20:小指)
          const fingertips = [4, 8, 12, 16, 20];
          fingertips.forEach(idx => {
            const lm = landmarks[idx];
            if (lm) {
              const dist = Math.hypot(lm.x - normX, lm.y - normY);
              if (dist < minDist) {
                minDist = dist;
                matchedLandmarks = landmarks;
                targetLandmarkIndex = idx;
              }
            }
          });
        });
      }

      const elements = create3DBeamElements();

      activeBeams.push({
        x: clientX, y: clientY,
        smoothX: clientX, smoothY: clientY,
        matchedLandmarks: matchedLandmarks,
        targetLandmarkIndex: targetLandmarkIndex,
        elements: elements
      });

      statusEl.textContent = matchedLandmarks 
        ? `🖐️ 指先（ランドマーク #${targetLandmarkIndex}）をロックオン！ (合計: ${activeBeams.length}本)` 
        : `⚡ タップ位置にビーム発射！ (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.elements.outerMesh);
        scene.remove(lastBeam.elements.innerMesh);
        scene.remove(lastBeam.elements.ringMesh);
        scene.remove(lastBeam.elements.particleSystem);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => {
        scene.remove(b.elements.outerMesh);
        scene.remove(b.elements.innerMesh);
        scene.remove(b.elements.ringMesh);
        scene.remove(b.elements.particleSystem);
      });
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      if (handsDetector && !isHandsProcessing) {
        isHandsProcessing = true;
        handsDetector.send({ image: videoElement }).catch(() => { isHandsProcessing = false; });
      }

      activeBeams.forEach(beam => {
        if (beam.matchedLandmarks && latestHandLandmarks.length > 0) {
          // 最も近くにある手のランドマーク群を再取得して追従
          const targetLm = beam.matchedLandmarks[beam.targetLandmarkIndex];
          if (targetLm) {
            beam.x = targetLm.x * window.innerWidth;
            beam.y = targetLm.y * window.innerHeight;
          }
        }
      });
    }

    async function startCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function alignCylinder(mesh, p1, p2) {
      const midpoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      const length = p1.distanceTo(p2);
      mesh.position.copy(midpoint);
      mesh.scale.set(1, length, 1);
      mesh.lookAt(p2);
      mesh.rotateX(Math.PI / 2);
    }

    function animate() {
      requestAnimationFrame(animate);
      trackObjects();

      activeBeams.forEach((beam) => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.4;
        beam.smoothY += (beam.y - beam.smoothY) * 0.4;

        // 1. 指先の3D座標
        const tip3D = screenTo3D(beam.smoothX, beam.smoothY, -8);

        // 2. 指先の向いている向き（関節の角度情報などを利用した方向ベクトル）
        let directionVector = new THREE.Vector3(0, 0, -1);
        if (beam.matchedLandmarks) {
          // 指先(例: 8)とその手前の関節(例: 6)のベクトルから、指が伸びている方向を計算
          const tip = beam.matchedLandmarks[beam.targetLandmarkIndex];
          const joint = beam.matchedLandmarks[beam.targetLandmarkIndex - 2]; // 中間関節
          if (tip && joint) {
            const tipPos3D = screenTo3D(tip.x * window.innerWidth, tip.y * window.innerHeight, -8);
            const jointPos3D = screenTo3D(joint.x * window.innerWidth, joint.y * window.innerHeight, -8);
            directionVector = new THREE.Vector3().subVectors(tipPos3D, jointPos3D).normalize();
          }
        } else {
          directionVector = new THREE.Vector3().subVectors(tip3D, camera.position).normalize();
        }

        // 3. 指先からその方向へビームを延長
        const extensionLength = 20.0;
        const farEnd3D = tip3D.clone().add(directionVector.multiplyScalar(extensionLength));

        const { outerMesh, innerMesh, ringMesh, particleSystem, pVel } = beam.elements;

        alignCylinder(outerMesh, tip3D, farEnd3D);
        alignCylinder(innerMesh, tip3D, farEnd3D);

        ringMesh.position.copy(tip3D);
        ringMesh.lookAt(camera.position);

        particleSystem.position.copy(tip3D);
        const positions = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < pVel.length; i++) {
          positions[i*3] += pVel[i].x;
          positions[i*3+1] += pVel[i].y;
          positions[i*3+2] += pVel[i].z;
          if (Math.abs(positions[i*3]) > 0.4 || Math.abs(positions[i*3+1]) > 0.4 || Math.abs(positions[i*3+2]) > 0.4) {
            positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
