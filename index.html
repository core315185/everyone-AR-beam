<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Accurate AI Beam AR</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #000 100%);
      z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }
    .spinner {
      width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }
    #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    #ai-debug-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3; pointer-events: none; opacity: 0.7; }

    #ui-container {
      position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 0 20px;
    }
    #status {
      font-size: 14px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
      padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2);
    }
    button.nav-btn {
      background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 24px; border-radius: 15px; font-size: 14px; font-weight: 600; cursor: pointer;
      backdrop-filter: blur(10px); transition: background 0.2s; pointer-events: auto;
    }
    button.nav-btn:active { background: rgba(255,255,255,0.3); }
  </style>

  <!-- TensorFlow.js と COCO-SSD AIモデルの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- AI読込中画面 -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: bold; background: linear-gradient(90deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      AI 物体認識モデルをロード中...
    </div>
    <div style="font-size: 12px; color: #94a3b8;">初回のみ10秒ほどかかります</div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>
  <!-- AIの認識デバッグ表示用キャンバス -->
  <canvas id="ai-debug-canvas"></canvas>

  <div id="ui-container">
    <div id="status"> AI ロックオン準備完了</div>
    <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
  </div>

  <script>
    let currentFacingMode = 'environment'; // 精度向上のためアウトカメラをデフォルトに
    let videoElement = document.getElementById('webcam');
    let statusEl = document.getElementById('status');
    let loadingScreen = document.getElementById('loading-screen');

    let cocoSsdModel = null;
    let isDetecting = false;
    let lastDetectionResult = null;

    // AI認識デバッグ用キャンバス
    const debugCanvas = document.getElementById('ai-debug-canvas');
    const debugCtx = debugCanvas.getContext('2d');

    // Smooth追従用のローパスフィルター変数
    let smoothTargetX = window.innerWidth / 2;
    let smoothTargetY = window.innerHeight / 2;

    // --------------------------------------------------
    // 3D ビーム描画 (Three.js)
    // --------------------------------------------------
    const canvas3d = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3d.position.z = 10; // カメラを少し引く

    // 重厚感のある太いプラズマビーム
    const beamGroup = new THREE.Group();

    // 芯 (コア)
    const innerGeo = new THREE.CylinderGeometry(0.06, 0.02, 30, 16);
    innerGeo.rotateX(Math.PI / 2);
    innerGeo.translate(0, 0, -15);
    const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
    const innerMesh = new THREE.Mesh(innerGeo, innerMat);

    // オーラ
    const outerGeo = new THREE.CylinderGeometry(0.18, 0.06, 30, 16);
    outerGeo.rotateX(Math.PI / 2);
    outerGeo.translate(0, 0, -15);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);

    beamGroup.add(outerMesh);
    beamGroup.add(innerMesh);
    beamGroup.visible = false;
    scene.add(beamGroup);

    // --------------------------------------------------
    // AI 物体認識 (TensorFlow.js + COCO-SSD)
    // --------------------------------------------------
    async function initAI() {
      try {
        // AIモデルのロード
        cocoSsdModel = await cocoSsd.load({ base: 'mobilenet_v2' });
        console.log("AI Model Loaded");
        loadingScreen.style.display = 'none';
        startAIPreview();
      } catch (e) {
        console.error("AI Load Error:", e);
        statusEl.textContent = ' AIロード失敗。再読み込みしてください';
      }
    }

    // AIによる物体検出ループ
    async function startAIPreview() {
      if (!videoElement.srcObject || isDetecting) return;
      isDetecting = true;

      const vw = videoElement.videoWidth;
      const vh = videoElement.videoHeight;
      debugCanvas.width = vw;
      debugCanvas.height = vh;

      // ビデオフレームからAIが物体を検知
      const predictions = await cocoSsdModel.detect(videoElement, {
        maxNumBoxes: 1, // 精度向上のため、最も確実な1つだけを追従
        minScore: 0.5   // 信頼度50%以上
      });

      lastDetectionResult = predictions;
      
      // デバッグ用の枠描画
      drawAIDebug(predictions, vw, vh);

      isDetecting = false;
      // 次のフレームへ (高速処理のためrequestAnimationFrameを使用)
      requestAnimationFrame(startAIPreview);
    }

    // AI認識結果の描画 (デバッグ表示)
    function drawAIDebug(predictions, vw, vh) {
      debugCtx.clearRect(0, 0, vw, vh);
      if (predictions.length === 0) return;

      const p = predictions[0];
      const [x, y, width, height] = p.bbox;

      debugCtx.strokeStyle = '#3b82f6';
      debugCtx.lineWidth = 4;
      debugCtx.strokeRect(x, y, width, height);
      
      debugCtx.fillStyle = 'rgba(59, 130, 246, 0.8)';
      debugCtx.fillRect(x, y - 30, width, 30);
      debugCtx.fillStyle = '#fff';
      debugCtx.font = '24px bold sans-serif';
      debugCtx.fillText(`${p.class} (${Math.round(p.score * 100)}%)`, x + 5, y - 7);
    }

    // --------------------------------------------------
    // AR 追従ロジック
    // --------------------------------------------------
    function updateBeamTracking() {
      if (!lastDetectionResult || lastDetectionResult.length === 0) {
        beamGroup.visible = false;
        statusEl.textContent = ' AI ロックオン待機中... 物体をかざしてください';
        // ターゲットを画面中心に戻す
        smoothTargetX += (window.innerWidth / 2 - smoothTargetX) * 0.1;
        smoothTargetY += (window.innerHeight / 2 - smoothTargetY) * 0.1;
        return;
      }

      beamGroup.visible = true;
      const p = lastDetectionResult[0];
      const [bboxX, bboxY, bboxW, bboxH] = p.bbox;
      const vw = videoElement.videoWidth;
      const vh = videoElement.videoHeight;

      // 認識した物体の中心座標を計算 (ビデオ座標系)
      let centerX = bboxX + bboxW / 2;
      let centerY = bboxY + bboxH / 2;

      // フロントカメラ利用時はAIの座標を反転補正
      if (currentFacingMode === 'user') {
        centerX = vw - centerX;
      }

      // 画面座標系 (CSSピクセル) へ変換
      const targetX = (centerX / vw) * window.innerWidth;
      const targetY = (centerY / vh) * window.innerHeight;

      statusEl.textContent = `🎯 ${p.class.toUpperCase()} をロックオン！`;

      // ★ 超重要：ローパスフィルター (Smoothing)
      // 0.2は追従の鋭さ。数値を小さくすると、ガタつきが完全に消えて滑らかになります。
      smoothTargetX += (targetX - smoothTargetX) * 0.2;
      smoothTargetY += (targetY - smoothTargetY) * 0.2;

      // Three.js 3D世界座標系への変換
      const aspect = window.innerWidth / window.innerHeight;
      const normX = (smoothTargetX / window.innerWidth) * 2 - 1;
      const normY = -(smoothTargetY / window.innerHeight) * 2 + 1;

      // ビームの発生起点 (画面下部の中央に配置)
      const originX = 0;
      const originY = -5;
      const originZ = -1;

      // ビームのターゲット位置 (AI認識した物体の3D座標)
      // z座標(-10)へ向かうことで画面奥へ飛ばす
      const targetZ3D = -10;
      const targetX3D = normX * 8 * aspect;
      const targetY3D = normY * 8;

      beamGroup.position.set(originX, originY, originZ);

      // 起点からターゲットへの向きを計算してlookAt
      const targetVec = new THREE.Vector3(targetX3D, targetY3D, targetZ3D);
      beamGroup.lookAt(targetVec);
    }

    // --------------------------------------------------
    // アプリ制御・カメラ制御
    // --------------------------------------------------
    function startApp() {
      // ユーザーのジェスチャーを待ってAIロード開始
      statusEl.textContent = 'AIモデル読み込みを開始します...';
      initAI();
      // カメラも開始
      startCamera(currentFacingMode);
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();

      // カメラの向きでビデオの左右反転を制御
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {}, // AI検出は別のループで行う
        width: 1280, height: 720,
        facingMode: facingMode
      });

      cameraInstance.start().then(() => {
        // ビデオ起動後にAI処理を開始
        startAIPreview();
      }).catch((err) => {
        statusEl.textContent = 'カメラ読込失敗: ' + err.message;
      });
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    // --------------------------------------------------
    // メインレンダリングループ
    // --------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // AR追従位置の更新
      updateBeamTracking();

      // ビームのアニメーションエフェクト
      if (beamGroup.visible) {
        const time = Date.now() * 0.02;
        // プラズマのゆらぎ
        outerMat.opacity = 0.6 + Math.sin(time * 0.5) * 0.1;
      }
      
      renderer.render(scene, camera3d);
    }

    // --------------------------------------------------
    // 初期化とリサイズ対応
    // --------------------------------------------------
    window.addEventListener('load', startApp);

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      // AIデバッグキャンバスのリサイズ
      debugCanvas.width = videoElement.videoWidth;
      debugCanvas.height = videoElement.videoHeight;
    });

  </script>
</body>
</html>
