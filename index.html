<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Ultra Reliable Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas2d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas2d"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">画面上の人や物をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" onclick="removeLastBeam(event)">❌ 1本解除</button>
      <button class="nav-btn danger" onclick="removeAllBeams(event)">🗑 全削除</button>
      <button class="nav-btn" onclick="toggleCamera(event)">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const canvas = document.getElementById('canvas2d');
    const ctx = canvas.getContext('2d');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d');

    let currentFacingMode = 'environment';
    let cameraStream = null;
    let activeBeams = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function startApp() {
      startOverlay.style.display = 'none';
      resizeCanvas();
      startCamera(currentFacingMode);

      // タップ/クリックイベント
      canvas.addEventListener('pointerdown', handleTap);

      animate();
    }

    function handleTap(e) {
      if (e.clientY > window.innerHeight - 80) return;

      const x = e.clientX;
      const y = e.clientY;

      // 画像追従用パターンの保存
      let templateData = null;
      let videoX = 0, videoY = 0;

      if (videoElement.readyState === 4) {
        processCanvas.width = 320;
        processCanvas.height = 240;
        pCtx.drawImage(videoElement, 0, 0, 320, 240);
        
        videoX = (x / window.innerWidth) * 320;
        videoY = (y / window.innerHeight) * 240;

        templateData = pCtx.getImageData(
          Math.max(0, videoX - 15),
          Math.max(0, videoY - 15),
          30, 30
        );
      }

      activeBeams.push({
        x: x,
        y: y,
        smoothX: x,
        smoothY: y,
        videoX: videoX,
        videoY: videoY,
        template: templateData
      });

      statusEl.textContent = `⚡ ビームロックオン！ (合計: ${activeBeams.length}本)`;
    }

    function removeLastBeam(e) {
      if (e) e.stopPropagation();
      if (activeBeams.length > 0) {
        activeBeams.pop();
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    }

    function removeAllBeams(e) {
      if (e) e.stopPropagation();
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    }

    // 物体・映像トラッキング
    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState !== 4) return;

      processCanvas.width = 320;
      processCanvas.height = 240;
      pCtx.drawImage(videoElement, 0, 0, 320, 240);
      const frame = pCtx.getImageData(0, 0, 320, 240);
      const searchRadius = 15;

      activeBeams.forEach(beam => {
        if (!beam.template) return;

        let bestX = beam.videoX;
        let bestY = beam.videoY;
        let minDiff = Infinity;

        const tW = beam.template.width;
        const tH = beam.template.height;
        const tData = beam.template.data;

        for (let dy = -searchRadius; dy <= searchRadius; dy += 3) {
          for (let dx = -searchRadius; dx <= searchRadius; dx += 3) {
            const curX = Math.floor(beam.videoX + dx);
            const curY = Math.floor(beam.videoY + dy);

            if (curX < 0 || curX >= 320 - tW || curY < 0 || curY >= 240 - tH) continue;

            let diff = 0;
            for (let i = 0; i < tData.length; i += 16) {
              const fIdx = ((curY + Math.floor((i/4)/tW)) * 320 + (curX + ((i/4)%tW))) * 4;
              diff += Math.abs(frame.data[fIdx] - tData[i]) + Math.abs(frame.data[fIdx+1] - tData[i+1]) + Math.abs(frame.data[fIdx+2] - tData[i+2]);
            }

            if (diff < minDiff) {
              minDiff = diff;
              bestX = curX;
              bestY = curY;
            }
          }
        }

        beam.videoX = bestX;
        beam.videoY = bestY;
        beam.x = (bestX / 320) * window.innerWidth;
        beam.y = (bestY / 240) * window.innerHeight;
      });
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function toggleCamera(e) {
      if (e) e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      trackObjects();

      const startX = canvas.width / 2;
      const startY = canvas.height + 20; // 画面下部中央

      activeBeams.forEach((beam) => {
        // 対象座標への滑らかな補完移動
        beam.smoothX += (beam.x - beam.smoothX) * 0.2;
        beam.smoothY += (beam.y - beam.smoothY) * 0.2;

        const targetX = beam.smoothX;
        const targetY = beam.smoothY;

        // 1. ビームの外光（グローエフェクト）
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.restore();

        // 2. ビームの芯（白いライン）
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // 3. ロックオンターゲット（リングとコア）
        ctx.save();
        ctx.beginPath();
        ctx.arc(targetX, targetY, 20 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }
  </script>
</body>
</html>
