<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      padding: 24px;
      text-align: center;
    }

    #start-screen h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #start-screen p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .select-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .beam-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .beam-card:active { transform: scale(0.96); }
    .beam-card.red { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    .beam-card.blue { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    .beam-card.green { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }

    #selection-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      cursor: crosshair;
    }

    #ui-container {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      pointer-events: none;
    }

    .title-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-tag span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    #status {
      color: #e2e8f0;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }

    .panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.nav-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.nav-btn.active {
      background: #3b82f6;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-screen">
    <h1>Everyone AR Beam</h1>
    <p>ビームのタイプを選択してください</p>
    
    <div class="select-grid">
      <div class="beam-card red" onclick="startApp('red')">
        <span>🔴 レッドレーザー</span>
        <span>▶</span>
      </div>
      <div class="beam-card blue" onclick="startApp('blue')">
        <span>⚡ プラズマブルー</span>
        <span>▶</span>
      </div>
      <div class="beam-card green" onclick="startApp('green')">
        <span>🟢 プラズマグリーン</span>
        <span>▶</span>
      </div>
    </div>
  </div>

  <div class="title-tag">
    <span></span> ARマルチビーム実行中
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>
  <canvas id="selection-canvas"></canvas>

  <div id="ui-container">
    <div id="status">カメラ準備中...</div>
    <div class="panel">
      <button id="mode-btn" class="nav-btn" onclick="toggleMode()">🖱 囲みモード切替</button>
      <button id="clear-btn" class="nav-btn" style="display:none;" onclick="clearCustomTargets()">🗑 囲みリセット</button>
      <button class="nav-btn" onclick="backToMenu()">⚙ ビーム変更</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    let currentFacingMode = 'user';
    let cameraInstance = null;
    let activeBeamType = 'red';
    let trackingMode = 'hand';
    let audioCtx = null, beamSoundNode = null, beamGainNode = null;

    const MAX_BEAMS = 10;
    const beamPool = [];

    const beamStyles = {
      red:   { color: 0xff1100, coreColor: 0xffffff, pitch: 300 },
      blue:  { color: 0x00d2ff, coreColor: 0xe0ffff, pitch: 450 },
      green: { color: 0x00ff66, coreColor: 0xffffff, pitch: 220 }
    };

    const statusEl = document.getElementById('status');
    const videoElement = document.getElementById('webcam');
    const startScreen = document.getElementById('start-screen');

    // --------------------------------------------------
    // オーディオ（効果音）
    // --------------------------------------------------
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startBeamSound() {
      initAudio();
      if (beamSoundNode) return;
      const style = beamStyles[activeBeamType];
      beamSoundNode = audioCtx.createOscillator();
      beamGainNode = audioCtx.createGain();
      beamSoundNode.type = 'sawtooth';
      beamSoundNode.frequency.setValueAtTime(style.pitch, audioCtx.currentTime);
      beamGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
      beamGainNode.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);
      beamSoundNode.connect(beamGainNode);
      beamGainNode.connect(audioCtx.destination);
      beamSoundNode.start();
    }

    function stopBeamSound() {
      if (beamSoundNode && beamGainNode) {
        beamGainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => {
          if (beamSoundNode) {
            beamSoundNode.stop();
            beamSoundNode.disconnect();
            beamSoundNode = null;
            beamGainNode = null;
          }
        }, 100);
      }
    }

    // --------------------------------------------------
    // Three.js (複数ビームの生成と管理)
    // --------------------------------------------------
    const canvas3d = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3d.position.z = 5;

    function createSingleBeamGroup() {
      const group = new THREE.Group();

      const outerGeo = new THREE.CylinderGeometry(0.04, 0.008, 10, 16);
      outerGeo.rotateX(Math.PI / 2);
      outerGeo.translate(0, 0, -5);
      const outerMat = new THREE.MeshBasicMaterial({ color: 0xff1100, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);

      const innerGeo = new THREE.CylinderGeometry(0.015, 0.003, 10, 16);
      innerGeo.rotateX(Math.PI / 2);
      innerGeo.translate(0, 0, -5);
      const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);

      const ringGeo = new THREE.RingGeometry(0.03, 0.06, 16);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);

      group.add(outerMesh);
      group.add(innerMesh);
      group.add(ringMesh);
      group.visible = false;

      return { group, outerMat, innerMat, ringMat, ringMesh };
    }

    for (let i = 0; i < MAX_BEAMS; i++) {
      const beamObj = createSingleBeamGroup();
      beamPool.push(beamObj);
      scene.add(beamObj.group);
    }

    function applyBeamStyle(type) {
      activeBeamType = type;
      const style = beamStyles[type];
      beamPool.forEach(b => {
        b.outerMat.color.setHex(style.color);
        b.innerMat.color.setHex(style.coreColor);
        b.ringMat.color.setHex(style.color);
      });
    }

    function hideAllBeams() {
      beamPool.forEach(b => b.group.visible = false);
    }

    // --------------------------------------------------
    // ドラッグ複数箇所囲み機能
    // --------------------------------------------------
    const selectionCanvas = document.getElementById('selection-canvas');
    const ctxSelect = selectionCanvas.getContext('2d');
    selectionCanvas.width = window.innerWidth;
    selectionCanvas.height = window.innerHeight;

    let isDrawing = false;
    let pathPoints = [];
    let customTargets = [];

    selectionCanvas.addEventListener('mousedown', startDraw);
    selectionCanvas.addEventListener('mousemove', draw);
    selectionCanvas.addEventListener('mouseup', endDraw);
    selectionCanvas.addEventListener('touchstart', (e) => startDraw(e.touches[0]));
    selectionCanvas.addEventListener('touchmove', (e) => draw(e.touches[0]));
    selectionCanvas.addEventListener('touchend', endDraw);

    function startDraw(e) {
      if (trackingMode !== 'custom') return;
      isDrawing = true;
      pathPoints = [{ x: e.clientX, y: e.clientY }];
    }

    function draw(e) {
      if (!isDrawing || trackingMode !== 'custom') return;
      pathPoints.push({ x: e.clientX, y: e.clientY });

      ctxSelect.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
      ctxSelect.strokeStyle = '#60a5fa';
      ctxSelect.lineWidth = 3;
      ctxSelect.setLineDash([6, 6]);
      ctxSelect.beginPath();
      ctxSelect.moveTo(pathPoints[0].x, pathPoints[0].y);
      for (let i = 1; i < pathPoints.length; i++) {
        ctxSelect.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
      ctxSelect.stroke();
    }

    function endDraw() {
      if (!isDrawing || trackingMode !== 'custom') return;
      isDrawing = false;
      ctxSelect.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);

      if (pathPoints.length > 3) {
        let sumX = 0, sumY = 0;
        pathPoints.forEach(p => { sumX += p.x; sumY += p.y; });
        const avgX = sumX / pathPoints.length;
        const avgY = sumY / pathPoints.length;

        const normX = (avgX / window.innerWidth) * 2 - 1;
        const normY = -(avgY / window.innerHeight) * 2 + 1;
        const aspect = window.innerWidth / window.innerHeight;

        customTargets.push({
          x: normX * 2 * aspect,
          y: normY * 2,
          z: -1
        });

        statusEl.textContent = `🎯 ${customTargets.length}箇所からマルチビーム照射中！ (続けて囲めます)`;
      }
    }

    function clearCustomTargets() {
      customTargets = [];
      hideAllBeams();
      stopBeamSound();
      statusEl.textContent = '囲みがリセットされました。出したい場所を丸く囲んでください';
    }

    function toggleMode() {
      trackingMode = (trackingMode === 'hand') ? 'custom' : 'hand';
      const modeBtn = document.getElementById('mode-btn');
      const clearBtn = document.getElementById('clear-btn');
      
      if (trackingMode === 'custom') {
        modeBtn.classList.add('active');
        clearBtn.style.display = 'inline-block';
        statusEl.textContent = '画面上の出したい物を何箇所でも「丸く囲んで」みてください';
        hideAllBeams();
        stopBeamSound();
      } else {
        modeBtn.classList.remove('active');
        clearBtn.style.display = 'none';
        statusEl.textContent = '手の認識モード（複数指先対応）';
      }
    }

    // --------------------------------------------------
    // MediaPipe Hands (複数指先認識: 人差し指・中指・薬指)
    // --------------------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    // 指の定義 (先端と関節ペア)
    const fingerPairs = [
      { tip: 8,  dip: 6 },  // 人差し指
      { tip: 12, dip: 10 }, // 中指
      { tip: 16, dip: 14 }  // 薬指
    ];

    hands.onResults((results) => {
      hideAllBeams();

      // カスタム（囲み）モード
      if (trackingMode === 'custom') {
        if (customTargets.length > 0) {
          customTargets.forEach((target, idx) => {
            if (idx < MAX_BEAMS) {
              const b = beamPool[idx];
              b.group.position.set(target.x, target.y, target.z);
              b.group.lookAt(target.x, target.y, target.z - 10);
              b.group.visible = true;
            }
          });
          startBeamSound();
        } else {
          stopBeamSound();
        }
        return;
      }

      // 手認識モード（複数指から同時に発射）
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const isUser = (currentFacingMode === 'user');
        const aspect = window.innerWidth / window.innerHeight;
        let activeCount = 0;

        fingerPairs.forEach((finger, idx) => {
          const tip = landmarks[finger.tip];
          const dip = landmarks[finger.dip];

          const rawTipX = isUser ? (1 - tip.x) : tip.x;
          const rawDipX = isUser ? (1 - dip.x) : dip.x;

          const tipX = (rawTipX - 0.5) * 4 * aspect;
          const tipY = (0.5 - tip.y) * 4;
          const tipZ = -tip.z * 4;

          const dipX = (rawDipX - 0.5) * 4 * aspect;
          const dipY = (0.5 - dip.y) * 4;
          const dipZ = -dip.z * 4;

          const b = beamPool[idx];
          b.group.position.set(tipX, tipY, tipZ);

          const dir = new THREE.Vector3(tipX - dipX, tipY - dipY, tipZ - dipZ).normalize();
          const targetPos = new THREE.Vector3().addVectors(b.group.position, dir);
          b.group.lookAt(targetPos);

          b.group.visible = true;
          activeCount++;
        });

        statusEl.textContent = `マルチ指先認識中 ⚡ (${activeCount}本発射中)`;
        startBeamSound();
      } else {
        statusEl.textContent = 'カメラに手をかざすか、囲みモードをお試しください';
        stopBeamSound();
      }
    });

    // --------------------------------------------------
    // アプリ制御
    // --------------------------------------------------
    function startApp(beamType) {
      applyBeamStyle(beamType);
      startScreen.style.display = 'none';
      initAudio();
      startCamera(currentFacingMode);
    }

    function backToMenu() {
      if (cameraInstance) cameraInstance.stop();
      hideAllBeams();
      stopBeamSound();
      startScreen.style.display = 'flex';
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: facingMode
      });

      cameraInstance.start().then(() => {
        statusEl.textContent = 'カメラ準備完了！手をかざすか囲みモードを選択してください';
      }).catch((err) => {
        statusEl.textContent = 'カメラ読込失敗: ' + err.message;
      });
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.015;
      beamPool.forEach(b => {
        if (b.group.visible) {
          b.outerMat.opacity = 0.5 + Math.sin(time) * 0.2;
          b.ringMesh.rotation.z += 0.05;
        }
      });
      renderer.render(scene, camera3d);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      selectionCanvas.width = window.innerWidth;
      selectionCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
