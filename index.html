<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Tip Extension Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; /* 左右反転なし（通常表示） */
      pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">⚡ ARビームを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">物の先端（ペン先や指先など）をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
      <button class="nav-btn" id="cam-btn">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    let currentFacingMode = 'environment';
    let cameraStream = null;
    let activeBeams = [];

    const PROC_W = 160;
    const PROC_H = 120;
    const TEMP_SIZE = 16;

    let scene, camera, renderer;
    const Z_PLANE = -10;

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // 先端からさらに延長していく3Dビームメッシュの生成
    function create3DExtendedBeamMesh() {
      const group = new THREE.Group();

      // 外側ビーム（先端からさらに奥へ延長）
      const outerGeo = new THREE.CylinderGeometry(0.15, 0.04, 1, 8);
      outerGeo.rotateX(Math.PI / 2);
      outerGeo.translate(0, 0, 0.5);

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      group.add(new THREE.Mesh(outerGeo, outerMat));

      // 内側芯
      const innerGeo = new THREE.CylinderGeometry(0.05, 0.01, 1, 6);
      innerGeo.rotateX(Math.PI / 2);
      innerGeo.translate(0, 0, 0.5);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      group.add(new THREE.Mesh(innerGeo, innerMat));

      scene.add(group);

      // タップした先端のリングエフェクト
      const ringGeo = new THREE.RingGeometry(0.18, 0.24, 16);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      scene.add(ringMesh);

      // 先端スパーク粒子
      const pCount = 12;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];

      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3(
          (Math.random() - 0.5) * 0.06,
          (Math.random() - 0.5) * 0.06,
          (Math.random() - 0.5) * 0.06
        ));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.08, transparent: true, blending: THREE.AdditiveBlending
      });
      const particleSystem = new THREE.Points(pGeo, pMat);
      scene.add(particleSystem);

      return { group, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      init3D();
      startCamera(currentFacingMode);
      animate();
    });

    function extractLuminance(imageData) {
      const lum = new Float32Array(imageData.width * imageData.height);
      const d = imageData.data;
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        lum[j] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      }
      return lum;
    }

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      let lumTemplate = null;
      let videoX = 0, videoY = 0;

      if (videoElement.readyState >= 2) {
        try {
          processCanvas.width = PROC_W;
          processCanvas.height = PROC_H;

          // 反転なしのそのままの座標
          pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
          
          videoX = (clientX / window.innerWidth) * PROC_W;
          videoY = (clientY / window.innerHeight) * PROC_H;

          const startX = Math.max(0, Math.min(PROC_W - TEMP_SIZE, Math.floor(videoX - TEMP_SIZE / 2)));
          const startY = Math.max(0, Math.min(PROC_H - TEMP_SIZE, Math.floor(videoY - TEMP_SIZE / 2)));

          const crop = pCtx.getImageData(startX, startY, TEMP_SIZE, TEMP_SIZE);
          lumTemplate = extractLuminance(crop);
        } catch (err) {}
      }

      const meshData = create3DExtendedBeamMesh();

      activeBeams.push({
        x: clientX,
        y: clientY,
        smoothX: clientX,
        smoothY: clientY,
        videoX: videoX,
        videoY: videoY,
        vx: 0,
        vy: 0,
        lumTemplate: lumTemplate,
        meshData: meshData
      });

      statusEl.textContent = `⚡ 先端認識・ビーム延長中！ (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.meshData.group);
        scene.remove(lastBeam.meshData.ringMesh);
        scene.remove(lastBeam.meshData.particleSystem);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => {
        scene.remove(b.meshData.group);
        scene.remove(b.meshData.ringMesh);
        scene.remove(b.meshData.particleSystem);
      });
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    document.getElementById('cam-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    });

    // 高精度テンプレートマッチングによる「物の先端」追従トラッキング
    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      try {
        processCanvas.width = PROC_W;
        processCanvas.height = PROC_H;
        pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
        const frameData = pCtx.getImageData(0, 0, PROC_W, PROC_H);
        const frameLum = extractLuminance(frameData);

        activeBeams.forEach(beam => {
          if (!beam.lumTemplate) return;

          const tLum = beam.lumTemplate;
          let bestX = beam.videoX;
          let bestY = beam.videoY;
          let minSad = Infinity;

          const predictX = beam.videoX + beam.vx;
          const predictY = beam.videoY + beam.vy;

          const searchRange = 32;
          for (let dy = -searchRange; dy <= searchRange; dy += 2) {
            for (let dx = -searchRange; dx <= searchRange; dx += 2) {
              const cx = Math.floor(predictX + dx);
              const cy = Math.floor(predictY + dy);
              if (cx < 0 || cx >= PROC_W - TEMP_SIZE || cy < 0 || cy >= PROC_H - TEMP_SIZE) continue;

              let sad = 0;
              for (let ty = 0; ty < TEMP_SIZE; ty += 2) {
                for (let tx = 0; tx < TEMP_SIZE; tx += 2) {
                  const fIdx = (cy + ty) * PROC_W + (cx + tx);
                  const tIdx = ty * TEMP_SIZE + tx;
                  sad += Math.abs(frameLum[fIdx] - tLum[tIdx]);
                }
              }

              if (sad < minSad) {
                minSad = sad;
                bestX = cx;
                bestY = cy;
              }
            }
          }

          const avgSad = minSad / (TEMP_SIZE * TEMP_SIZE / 4);
          if (avgSad < 55) {
            beam.vx = (bestX - beam.videoX) * 0.45;
            beam.vy = (bestY - beam.videoY) * 0.45;

            beam.videoX = bestX;
            beam.videoY = bestY;

            beam.x = (bestX / PROC_W) * window.innerWidth;
            beam.y = (bestY / PROC_H) * window.innerHeight;
          } else {
            beam.videoX += beam.vx;
            beam.videoY += beam.vy;
            beam.vx *= 0.7;
            beam.vy *= 0.7;
          }
        });
      } catch (err) {}
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = 'none'; // 反転なし

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 480 }, height: { ideal: 360 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      trackObjects();

      activeBeams.forEach((beam) => {
        // 先端位置のスムージング
        beam.smoothX += (beam.x - beam.smoothX) * 0.4;
        beam.smoothY += (beam.y - beam.smoothY) * 0.4;

        // タップした「物の先端」の3D位置
        const tip3D = screenTo3D(beam.smoothX, beam.smoothY, -8);
        
        // カメラからその先端へ向かう方向ベクトルを算出し、その先端を起点にさらに奥（奥行き方向）へビームを延長させる
        const camPos = camera.position;
        const dir = new THREE.Vector3().subVectors(tip3D, camPos).normalize();
        
        // 先端からさらに向こうへ「延長」させる長さ
        const extensionLength = 15.0; 
        const farEnd3D = tip3D.clone().add(dir.multiplyScalar(extensionLength));

        const { group, ringMesh, particleSystem, pVel } = beam.meshData;

        // ビームを先端(tip3D)から奥(farEnd3D)へ配置・延長
        const beamDir = new THREE.Vector3().subVectors(farEnd3D, tip3D);
        const beamLen = beamDir.length();
        beamDir.normalize();

        group.position.copy(tip3D);
        group.lookAt(farEnd3D);
        group.scale.set(1, 1, beamLen);

        // リングとパーティクルを「物の先端」にピタリと合わせる
        ringMesh.position.copy(tip3D);
        ringMesh.lookAt(camera.position);

        particleSystem.position.copy(tip3D);
        const positions = particleSystem.geometry.attributes.position.array;

        for (let i = 0; i < pVel.length; i++) {
          positions[i*3] += pVel[i].x;
          positions[i*3+1] += pVel[i].y;
          positions[i*3+2] += pVel[i].z;

          if (Math.abs(positions[i*3]) > 0.4 || Math.abs(positions[i*3+1]) > 0.4 || Math.abs(positions[i*3+2]) > 0.4) {
            positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
