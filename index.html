<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - AI Skeleton & Tip Extension</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Pose (骨格検出AI) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">⚡ AI骨格認識 ARビーム開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">人体の先端（手や指など）をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    let cameraStream = null;
    let activeBeams = [];

    let scene, camera, renderer;
    const Z_PLANE = -10;

    // MediaPipe Pose 骨格検出
    let poseDetector = null;
    let latestPoseLandmarks = null;
    let isPoseProcessing = false;

    function initAI() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      poseDetector.onResults((results) => {
        latestPoseLandmarks = results.poseLandmarks || null;
        isPoseProcessing = false;
      });
    }

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // 先端から奥へ延長する3Dビームの構築
    function create3DExtendedBeamMesh() {
      const group = new THREE.Group();

      // 外側ビーム（シリンダーをY軸方向に生成し、底面を原点にする）
      const outerGeo = new THREE.CylinderGeometry(0.18, 0.04, 1, 12);
      outerGeo.translate(0, 0.5, 0); // 原点を底面（先端）に合わせる

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(outerGeo, outerMat));

      // 内側芯ビーム
      const innerGeo = new THREE.CylinderGeometry(0.06, 0.01, 1, 8);
      innerGeo.translate(0, 0.5, 0);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(innerGeo, innerMat));

      scene.add(group);

      // タップ（先端）位置のロックオンリング
      const ringGeo = new THREE.RingGeometry(0.2, 0.26, 24);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      scene.add(ringMesh);

      // 先端スパーク粒子
      const pCount = 15;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];

      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3(
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.08
        ));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.08, transparent: true, blending: THREE.AdditiveBlending
      });
      const particleSystem = new THREE.Points(pGeo, pMat);
      scene.add(particleSystem);

      return { group, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      initAI();
      init3D();
      startCamera();
      animate();
    });

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      let matchedLandmarkIndex = -1;

      // 1. タップ位置の近くに骨格の関節（手首、指先など）があるか検索
      if (latestPoseLandmarks) {
        const normX = clientX / window.innerWidth;
        const normY = clientY / window.innerHeight;
        let minDist = 0.2; // 許容範囲

        // 主要な関節インデックス (15:右手首, 16:左手首, 19:右手, 20:左手など)
        const targetIndices = [15, 16, 17, 18, 19, 20, 21, 22];
        targetIndices.forEach(idx => {
          const lm = latestPoseLandmarks[idx];
          if (lm && lm.visibility > 0.5) {
            const dist = Math.hypot(lm.x - normX, lm.y - normY);
            if (dist < minDist) {
              minDist = dist;
              matchedLandmarkIndex = idx;
            }
          }
        });
      }

      const meshData = create3DExtendedBeamMesh();

      activeBeams.push({
        x: clientX,
        y: clientY,
        smoothX: clientX,
        smoothY: clientY,
        landmarkIndex: matchedLandmarkIndex, // 骨格追従モード (-1なら通常テンプレート追従)
        meshData: meshData
      });

      statusEl.textContent = matchedLandmarkIndex !== -1 
        ? `🤖 骨格の先端をロックオン！ (合計: ${activeBeams.length}本)` 
        : `⚡ ARビーム発射！ (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.meshData.group);
        scene.remove(lastBeam.meshData.ringMesh);
        scene.remove(lastBeam.meshData.particleSystem);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => {
        scene.remove(b.meshData.group);
        scene.remove(b.meshData.ringMesh);
        scene.remove(b.meshData.particleSystem);
      });
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      // 骨格AIの送信
      if (poseDetector && !isPoseProcessing) {
        isPoseProcessing = true;
        poseDetector.send({ image: videoElement }).catch(() => { isPoseProcessing = false; });
      }

      activeBeams.forEach(beam => {
        // 骨格検出で一致する関節があれば、その正確な位置に先端を自動追従
        if (beam.landmarkIndex !== -1 && latestPoseLandmarks) {
          const lm = latestPoseLandmarks[beam.landmarkIndex];
          if (lm && lm.visibility > 0.4) {
            beam.x = lm.x * window.innerWidth;
            beam.y = lm.y * window.innerHeight;
          }
        }
      });
    }

    async function startCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    const defaultUp = new THREE.Vector3(0, 1, 0); // シリンダーの伸びる基準軸

    function animate() {
      requestAnimationFrame(animate);

      trackObjects();

      activeBeams.forEach((beam) => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.4;
        beam.smoothY += (beam.y - beam.smoothY) * 0.4;

        // 1. 選択された先端（ターゲット）の3D座標
        const tip3D = screenTo3D(beam.smoothX, beam.smoothY, -8);

        // 2. 先端からさらにカメラの視線方向へ向かって奥へ「延長」させる終点座標
        const camPos = camera.position;
        const rayDir = new THREE.Vector3().subVectors(tip3D, camPos).normalize();
        const extensionLength = 20.0; // ビームの長さ
        const farEnd3D = tip3D.clone().add(rayDir.multiplyScalar(extensionLength));

        const { group, ringMesh, particleSystem, pVel } = beam.meshData;

        // 3. ビームの向きと長さを正確に計算して適用
        const beamDir = new THREE.Vector3().subVectors(farEnd3D, tip3D);
        const beamLength = beamDir.length();
        beamDir.normalize();

        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(defaultUp, beamDir);

        group.position.copy(tip3D);
        group.quaternion.copy(quaternion);
        group.scale.set(1, beamLength, 1); // 縦方向（Y軸）にビームを延長

        // 4. リングとパーティクルを先端に同期
        ringMesh.position.copy(tip3D);
        ringMesh.lookAt(camera.position);

        particleSystem.position.copy(tip3D);
        const positions = particleSystem.geometry.attributes.position.array;

        for (let i = 0; i < pVel.length; i++) {
          positions[i*3] += pVel[i].x;
          positions[i*3+1] += pVel[i].y;
          positions[i*3+2] += pVel[i].z;

          if (Math.abs(positions[i*3]) > 0.4 || Math.abs(positions[i*3+1]) > 0.4 || Math.abs(positions[i*3+2]) > 0.4) {
            positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
