<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Error Free Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none; /* スマホのデフォルトスクロール・ズームを強制禁止 */
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
      pointer-events: none;
    }

    #canvas2d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas2d"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">画面上の人や物をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
      <button class="nav-btn" id="cam-btn">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas = document.getElementById('canvas2d');
    const ctx = canvas.getContext('2d');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d');

    let currentFacingMode = 'environment';
    let cameraStream = null;
    let activeBeams = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);

    // 開始処理
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      resizeCanvas();
      startCamera(currentFacingMode);
      animate();
    });

    // タップイベントをキャンバスに直接紐付け（clickとtouchstartの両対応）
    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return; // UIボタン領域は除外

      let templateData = null;
      let videoX = 0, videoY = 0;

      // カメラ準備OKなら画像パターンを抽出
      if (videoElement.readyState >= 2) {
        try {
          processCanvas.width = 320;
          processCanvas.height = 240;
          pCtx.drawImage(videoElement, 0, 0, 320, 240);
          
          videoX = (clientX / window.innerWidth) * 320;
          videoY = (clientY / window.innerHeight) * 240;

          templateData = pCtx.getImageData(
            Math.max(0, Math.min(290, videoX - 15)),
            Math.max(0, Math.min(210, videoY - 15)),
            30, 30
          );
        } catch (err) {
          console.warn("Template extraction failed, fallback to static pos.", err);
        }
      }

      activeBeams.push({
        x: clientX,
        y: clientY,
        smoothX: clientX,
        smoothY: clientY,
        videoX: videoX,
        videoY: videoY,
        template: templateData
      });

      statusEl.textContent = `⚡ ビーム発射！ (合計: ${activeBeams.length}本)`;
    }

    // Touch & Mouse の両イベントを確実にキャッチ
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    // UIボタン機能
    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        activeBeams.pop();
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    document.getElementById('cam-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    });

    // 安全なオプティカルフロー追従処理
    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      try {
        processCanvas.width = 320;
        processCanvas.height = 240;
        pCtx.drawImage(videoElement, 0, 0, 320, 240);
        const frame = pCtx.getImageData(0, 0, 320, 240);
        const searchRadius = 12;

        activeBeams.forEach(beam => {
          if (!beam.template) return;

          let bestX = beam.videoX;
          let bestY = beam.videoY;
          let minDiff = Infinity;

          const tW = beam.template.width;
          const tH = beam.template.height;
          const tData = beam.template.data;

          for (let dy = -searchRadius; dy <= searchRadius; dy += 4) {
            for (let dx = -searchRadius; dx <= searchRadius; dx += 4) {
              const curX = Math.floor(beam.videoX + dx);
              const curY = Math.floor(beam.videoY + dy);

              if (curX < 0 || curX >= 320 - tW || curY < 0 || curY >= 240 - tH) continue;

              let diff = 0;
              for (let i = 0; i < tData.length; i += 32) { // 軽量化
                const fIdx = ((curY + Math.floor((i/4)/tW)) * 320 + (curX + ((i/4)%tW))) * 4;
                diff += Math.abs(frame.data[fIdx] - tData[i]) + Math.abs(frame.data[fIdx+1] - tData[i+1]);
              }

              if (diff < minDiff) {
                minDiff = diff;
                bestX = curX;
                bestY = curY;
              }
            }
          }

          beam.videoX = bestX;
          beam.videoY = bestY;
          beam.x = (bestX / 320) * window.innerWidth;
          beam.y = (bestY / 240) * window.innerHeight;
        });
      } catch (err) {
        // エラーが起きてもアニメーションループを止めない
      }
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // 描画エリアのクリア
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      trackObjects();

      const startX = window.innerWidth / 2;
      const startY = window.innerHeight + 10;

      activeBeams.forEach((beam) => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.25;
        beam.smoothY += (beam.y - beam.smoothY) * 0.25;

        const targetX = beam.smoothX;
        const targetY = beam.smoothY;

        // 1. ビーム外光（発光）
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.85)';
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.restore();

        // 2. ビーム芯（白）
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // 3. 照準ターゲット
        ctx.save();
        ctx.beginPath();
        ctx.arc(targetX, targetY, 20 + Math.sin(Date.now() * 0.01) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }
  </script>
</body>
</html>
