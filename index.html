<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Next-Gen HTML5 Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(10,25,47,0.95) 0%, rgba(0,0,0,0.98) 100%);
      z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(10, 25, 47, 0.85);
      padding: 10px 20px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
      backdrop-filter: blur(5px);
    }
    .btn-group { display: flex; gap: 8px; pointer-events: auto; }
    button.nav-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; border: none;
      padding: 10px 18px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: transform 0.1s;
    }
    button.nav-btn:active { transform: scale(0.95); }
    button.nav-btn.danger { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
  </style>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="start-overlay">
    <h1 style="font-size: 24px; margin: 0; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.6);">⚡ NEXT-GEN HTML5 AR BEAM</h1>
    <p style="font-size: 14px; color: #94a3b8; margin: 0;">シングルファイル WebGL / MediaPipe 限界検証ビルド</p>
    <button class="nav-btn" id="start-btn" style="padding: 14px 28px; font-size: 16px;">🚀 システム起動</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>

  <div id="ui-container">
    <div id="status">カメラに手をかざし、指先をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');

    let cameraStream = null;
    let activeBeams = [];
    let scene, camera, renderer;
    const Z_PLANE = -10;

    let handsDetector = null;
    let latestHandLandmarks = [];
    let isHandsProcessing = false;

    function initAI() {
      handsDetector = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      handsDetector.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      handsDetector.onResults((results) => {
        latestHandLandmarks = results.multiHandLandmarks || [];
        isHandsProcessing = false;
      });
    }

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function normalizedToScreen(normX, normY) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const videoW = videoElement.videoWidth || 640;
      const videoH = videoElement.videoHeight || 480;

      const videoAspect = videoW / videoH;
      const screenAspect = vw / vh;

      let scale = 1, offsetX = 0, offsetY = 0;
      if (screenAspect > videoAspect) {
        scale = vw / videoW;
        offsetY = (vh - videoH * scale) / 2;
      } else {
        scale = vh / videoH;
        offsetX = (vw - videoW * scale) / 2;
      }

      return {
        x: normX * videoW * scale + offsetX,
        y: normY * videoH * scale + offsetY
      };
    }

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // ハイエンド・プラズマ発光ビーム要素の生成
    function create3DBeamElements() {
      const geom = new THREE.CylinderGeometry(0.22, 0.22, 1, 24, 1, true);
      geom.translate(0, 0.5, 0);
      geom.rotateX(Math.PI / 2);

      // 外側プラズマ光彩
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00f3ff, transparent: true, opacity: 0.7,
        side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const outerMesh = new THREE.Mesh(geom, outerMat);
      scene.add(outerMesh);

      // 内部高輝度コア
      const innerGeom = new THREE.CylinderGeometry(0.06, 0.06, 1, 16, 1, true);
      innerGeom.translate(0, 0.5, 0);
      innerGeom.rotateX(Math.PI / 2);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.95,
        side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const innerMesh = new THREE.Mesh(innerGeom, innerMat);
      scene.add(innerMesh);

      // 発光リング
      const ringMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.25, 32),
        new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      scene.add(ringMesh);

      // スパークパーティクル
      const pCount = 25;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];
      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3((Math.random()-0.5)*0.12, (Math.random()-0.5)*0.12, (Math.random()-0.5)*0.12));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.1, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      scene.add(particleSystem);

      return { outerMesh, innerMesh, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      initAI();
      init3D();
      startCamera();
      animate();
    });

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 90) return;

      let bestHandIdx = -1, targetIdx = 8, jointIdx = 6, minDist = 160;

      if (latestHandLandmarks.length > 0) {
        latestHandLandmarks.forEach((landmarks, handIdx) => {
          [4, 8, 12, 16, 20].forEach(idx => {
            const lm = landmarks[idx];
            if (lm) {
              const pt = normalizedToScreen(lm.x, lm.y);
              const dist = Math.hypot(pt.x - clientX, pt.y - clientY);
              if (dist < minDist) {
                minDist = dist;
                bestHandIdx = handIdx;
                targetIdx = idx;
                jointIdx = Math.max(0, idx - 2);
              }
            }
          });
        });
      }

      const elements = create3DBeamElements();
      activeBeams.push({
        x: clientX, y: clientY,
        smoothX: clientX, smoothY: clientY,
        jointX: clientX, jointY: clientY,
        smoothJointX: clientX, smoothJointY: clientY,
        handIdx: bestHandIdx, targetIdx, jointIdx,
        isTrackingAI: (bestHandIdx !== -1),
        elements
      });

      statusEl.textContent = (bestHandIdx !== -1)
        ? `⚡ プラズマビーム起動！ 指先 (#${targetIdx}) 追従中 (合計: ${activeBeams.length}本)`
        : `⚡ タップ位置にビーム発射 (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleTap(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY));

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const b = activeBeams.pop();
        scene.remove(b.elements.outerMesh); scene.remove(b.elements.innerMesh);
        scene.remove(b.elements.ringMesh); scene.remove(b.elements.particleSystem);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => {
        scene.remove(b.elements.outerMesh); scene.remove(b.elements.innerMesh);
        scene.remove(b.elements.ringMesh); scene.remove(b.elements.particleSystem);
      });
      activeBeams = [];
      statusEl.textContent = '🗑 すべて消去しました';
    });

    function trackObjects() {
      if (videoElement.readyState >= 2 && handsDetector && !isHandsProcessing) {
        isHandsProcessing = true;
        handsDetector.send({ image: videoElement }).catch(() => { isHandsProcessing = false; });
      }

      if (activeBeams.length === 0 || latestHandLandmarks.length === 0) return;

      activeBeams.forEach(beam => {
        let targetLandmarks = null;
        if (beam.handIdx !== -1 && latestHandLandmarks[beam.handIdx]) {
          targetLandmarks = latestHandLandmarks[beam.handIdx];
        } else if (latestHandLandmarks.length > 0) {
          let closest = Infinity;
          latestHandLandmarks.forEach(lms => {
            const lm = lms[beam.targetIdx];
            if (lm) {
              const pt = normalizedToScreen(lm.x, lm.y);
              const dist = Math.hypot(pt.x - beam.x, pt.y - beam.y);
              if (dist < closest) { closest = dist; targetLandmarks = lms; }
            }
          });
        }

        if (targetLandmarks) {
          const tip = targetLandmarks[beam.targetIdx];
          const joint = targetLandmarks[beam.jointIdx];
          if (tip) {
            const p = normalizedToScreen(tip.x, tip.y);
            beam.x = p.x; beam.y = p.y;
          }
          if (joint) {
            const p = normalizedToScreen(joint.x, joint.y);
            beam.jointX = p.x; beam.jointY = p.y;
          }
          beam.isTrackingAI = true;
        }
      });
    }

    async function startCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラエラー: ' + e.message;
      }
    }

    function alignCylinderToPoints(mesh, p1, p2) {
      const length = p1.distanceTo(p2);
      mesh.position.copy(p1);
      mesh.scale.set(1, 1, length);
      mesh.lookAt(p2);
    }

    function animate() {
      requestAnimationFrame(animate);
      trackObjects();

      activeBeams.forEach(beam => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.6;
        beam.smoothY += (beam.y - beam.smoothY) * 0.6;
        beam.smoothJointX += (beam.jointX - beam.smoothJointX) * 0.6;
        beam.smoothJointY += (beam.jointY - beam.smoothJointY) * 0.6;

        const tip3D = screenTo3D(beam.smoothX, beam.smoothY, -8);
        let dir = new THREE.Vector3(0, 0, -1);

        if (beam.isTrackingAI) {
          const joint3D = screenTo3D(beam.smoothJointX, beam.smoothJointY, -8);
          const v = new THREE.Vector3().subVectors(tip3D, joint3D);
          if (v.lengthSq() > 0.0001) dir = v.normalize();
        }

        const farEnd3D = tip3D.clone().add(dir.multiplyScalar(30.0));
        const { outerMesh, innerMesh, ringMesh, particleSystem, pVel } = beam.elements;

        alignCylinderToPoints(outerMesh, tip3D, farEnd3D);
        alignCylinderToPoints(innerMesh, tip3D, farEnd3D);
        ringMesh.position.copy(tip3D);
        ringMesh.lookAt(camera.position);

        particleSystem.position.copy(tip3D);
        const pos = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < pVel.length; i++) {
          pos[i*3] += pVel[i].x; pos[i*3+1] += pVel[i].y; pos[i*3+2] += pVel[i].z;
          if (Math.hypot(pos[i*3], pos[i*3+1], pos[i*3+2]) > 0.5) {
            pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) renderer.render(scene, camera);
    }
  </script>
</body>
</html>
