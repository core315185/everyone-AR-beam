<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Beam Test Mode</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5; /* 確実に最前面に描画 */
      pointer-events: none;
    }

    #ui-container {
      position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6;
    }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 12px 24px; border-radius: 20px; font-size: 16px; font-weight: bold;
    }
  </style>

  <!-- Three.js (軽量3D描画ライブラリ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">画面をタップしてテスト開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <div id="ui-container">
    <div id="status">画面上の好きな場所をタップしてください（手動ビームテスト）</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');

    let renderer, scene, camera3d, beamMesh, coreMesh;
    let targetX = 0, targetY = 0;
    let isBeamActive = false;

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      startCamera();
      
      // 画面タップで強制ビーム発射
      window.addEventListener('pointerdown', (e) => {
        isBeamActive = true;
        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = -(e.clientY / window.innerHeight) * 2 + 1;
        
        targetX = normX * 5;
        targetY = normY * 5;
        
        statusEl.textContent = `⚡ 手動ビーム出力中! (X: ${normX.toFixed(2)}, Y: ${normY.toFixed(2)})`;
      });

      animate();
    }

    function initThree() {
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.z = 10;

      // ビームの作成（巨大化させて視認性を最大に）
      const group = new THREE.Group();

      // 外枠（極太シリンダー）
      const geo = new THREE.CylinderGeometry(0.4, 0.1, 20, 16);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, -10);

      const mat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      beamMesh = new THREE.Mesh(geo, mat);

      // 芯
      const coreGeo = new THREE.CylinderGeometry(0.15, 0.03, 20, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -10);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      coreMesh = new THREE.Mesh(coreGeo, coreMat);

      group.add(beamMesh);
      group.add(coreMesh);
      scene.add(group);

      window.beamGroup = group;
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => { videoElement.srcObject = stream; })
        .catch(err => { statusEl.textContent = 'カメラ起動エラー: ' + err.message; });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (window.beamGroup && isBeamActive) {
        window.beamGroup.visible = true;
        // 手前下からタップ位置へ向けて照射
        window.beamGroup.position.set(0, -3, 2);
        window.beamGroup.lookAt(new THREE.Vector3(targetX, targetY, -10));
      } else if (window.beamGroup) {
        window.beamGroup.visible = false;
      }

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
