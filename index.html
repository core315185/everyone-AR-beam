<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Dynamic Position Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5;
      pointer-events: none;
    }

    #ui-container {
      position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
    }
    .btn-group { display: flex; gap: 8px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 12px 24px; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <div id="ui-container">
    <div id="status">カメラにかざすか、画面をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');

    let renderer, scene, camera3d, beamGroup, outerMat;
    let currentFacingMode = 'environment';
    let cameraInstance = null;

    let targetX = 0, targetY = 0;
    let smoothX = 0, smoothY = 0;
    let isLocked = false;

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      initMediaPipe();
      startCamera(currentFacingMode);

      window.addEventListener('pointerdown', (e) => {
        isLocked = true;
        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = -(e.clientY / window.innerHeight) * 2 + 1;
        targetX = normX * 5 * (window.innerWidth / window.innerHeight);
        targetY = normY * 5;
        statusEl.textContent = '⚡ タップ位置へビーム位置を移動中';
      });

      animate();
    }

    function initThree() {
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.z = 10;

      beamGroup = new THREE.Group();

      // 外枠のビーム
      const geo = new THREE.CylinderGeometry(0.3, 0.05, 30, 16);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, -15);

      outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const beamMesh = new THREE.Mesh(geo, outerMat);

      // 芯
      const coreGeo = new THREE.CylinderGeometry(0.1, 0.02, 30, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -15);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      beamGroup.add(beamMesh);
      beamGroup.add(coreMesh);
      beamGroup.visible = false;
      scene.add(beamGroup);
    }

    let hands = null;

    function initMediaPipe() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          isLocked = true;
          const landmarks = results.multiHandLandmarks[0];
          const tip = landmarks[8]; // 人差し指の先端

          const isUser = (currentFacingMode === 'user');
          const rawX = isUser ? (1 - tip.x) : tip.x;

          const normX = (rawX - 0.5) * 2;
          const normY = (0.5 - tip.y) * 2;

          targetX = normX * 5 * (window.innerWidth / window.innerHeight);
          targetY = normY * 5;

          statusEl.textContent = '🎯 指先（対象物）にビーム位置が完全追従中';
        }
      });
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          if (hands) await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        facingMode: facingMode
      });

      cameraInstance.start();
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isLocked && beamGroup) {
        beamGroup.visible = true;

        smoothX += (targetX - smoothX) * 0.2;
        smoothY += (targetY - smoothY) * 0.2;

        // ★ 発射位置（根本）そのものをターゲット座標に追従して並行移動させる
        beamGroup.position.set(smoothX, smoothY, 0);

        // 画面奥（Z軸マイナス方向）に向けてビームを照射
        beamGroup.lookAt(new THREE.Vector3(smoothX, smoothY, -20));

        outerMat.opacity = 0.75 + Math.sin(Date.now() * 0.01) * 0.15;
      }

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
