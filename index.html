<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Fixed Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">画面をタップしてビームを発射！</div>
    <div class="btn-group">
      <button class="nav-btn" onclick="removeLastBeam(event)">❌ 1本解除</button>
      <button class="nav-btn danger" onclick="removeAllBeams(event)">🗑 全削除</button>
      <button class="nav-btn" onclick="toggleCamera(event)">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const canvas = document.getElementById('canvas3d');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d');

    let renderer, scene, camera3d;
    let currentFacingMode = 'environment';
    let cameraStream = null;

    let activeBeams = [];

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      startCamera(currentFacingMode);

      // タップ・クリックイベントをキャンバスに登録
      window.addEventListener('click', handleTap);
      
      animate();
    }

    function handleTap(e) {
      // UIボタンエリアのタップを除外
      if (e.target.tagName === 'BUTTON' || e.clientY > window.innerHeight - 80) return;

      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = -(e.clientY / window.innerHeight) * 2 + 1;

      // 3D空間上のターゲット位置計算（Z=-10の平面上）
      const aspect = window.innerWidth / window.innerHeight;
      const targetX = normX * 4 * aspect;
      const targetY = normY * 4;
      const targetZ = -10;

      // トラッキング用画像データの抽出（カメラ準備完了時のみ）
      let templateData = null;
      let videoX = 0, videoY = 0;

      if (videoElement.readyState === 4) {
        processCanvas.width = 320;
        processCanvas.height = 240;
        pCtx.drawImage(videoElement, 0, 0, 320, 240);
        
        videoX = (e.clientX / window.innerWidth) * 320;
        videoY = (e.clientY / window.innerHeight) * 240;
        
        templateData = pCtx.getImageData(
          Math.max(0, videoX - 15),
          Math.max(0, videoY - 15),
          30, 30
        );
      }

      const beam = createBeamObject(targetX, targetY, targetZ, videoX, videoY, templateData);
      activeBeams.push(beam);

      statusEl.textContent = `⚡ ビーム発射中！ (合計: ${activeBeams.length}本)`;
    }

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.set(0, 0, 5); // カメラ位置を少し手前に
    }

    function createBeamObject(targetX, targetY, targetZ, videoX, videoY, templateData) {
      const group = new THREE.Group();

      // ビームの形状を作成 (長さを20に設定)
      const geo = new THREE.CylinderGeometry(0.15, 0.03, 20, 16);
      geo.rotateX(Math.PI / 2); // Z軸方向に向ける
      geo.translate(0, 0, -10); // 根本から奥へ20伸びる形状

      // ビームの外光（水色）
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const beamMesh = new THREE.Mesh(geo, outerMat);

      // ビームの芯（白）
      const coreGeo = new THREE.CylinderGeometry(0.05, 0.01, 20, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -10);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      group.add(beamMesh);
      group.add(coreMesh);

      // 発射位置（画面下部中央・手前）
      const startPos = new THREE.Vector3(0, -3, 2);
      group.position.copy(startPos);

      // タップした奥の方向を向く
      const targetVec = new THREE.Vector3(targetX, targetY, targetZ);
      group.lookAt(targetVec);

      scene.add(group);

      return {
        group: group,
        mat: outerMat,
        targetX: targetX, targetY: targetY, targetZ: targetZ,
        smoothTargetX: targetX, smoothTargetY: targetY, smoothTargetZ: targetZ,
        videoX: videoX, videoY: videoY,
        template: templateData
      };
    }

    function removeLastBeam(e) {
      if (e) e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.group);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    }

    function removeAllBeams(e) {
      if (e) e.stopPropagation();
      activeBeams.forEach(b => scene.remove(b.group));
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    }

    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState !== 4) return;

      processCanvas.width = 320;
      processCanvas.height = 240;
      pCtx.drawImage(videoElement, 0, 0, 320, 240);

      const frame = pCtx.getImageData(0, 0, 320, 240);
      const searchRadius = 20;

      activeBeams.forEach(beam => {
        if (!beam.template) return;

        let bestX = beam.videoX;
        let bestY = beam.videoY;
        let minDiff = Infinity;

        const tW = beam.template.width;
        const tH = beam.template.height;
        const tData = beam.template.data;

        for (let dy = -searchRadius; dy <= searchRadius; dy += 4) {
          for (let dx = -searchRadius; dx <= searchRadius; dx += 4) {
            const curX = Math.floor(beam.videoX + dx);
            const curY = Math.floor(beam.videoY + dy);

            if (curX < 0 || curX >= 320 - tW || curY < 0 || curY >= 240 - tH) continue;

            let diff = 0;
            for (let i = 0; i < tData.length; i += 16) {
              const fIdx = ((curY + Math.floor((i/4)/tW)) * 320 + (curX + ((i/4)%tW))) * 4;
              diff += Math.abs(frame.data[fIdx] - tData[i]) + Math.abs(frame.data[fIdx+1] - tData[i+1]) + Math.abs(frame.data[fIdx+2] - tData[i+2]);
            }

            if (diff < minDiff) {
              minDiff = diff;
              bestX = curX;
              bestY = curY;
            }
          }
        }

        beam.videoX = bestX;
        beam.videoY = bestY;

        const aspect = window.innerWidth / window.innerHeight;
        const normX = (bestX / 320) * 2 - 1;
        const normY = -(bestY / 240) * 2 + 1;
        beam.targetX = normX * 4 * aspect;
        beam.targetY = normY * 4;
      });
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラの取得に失敗しました';
      }
    }

    function toggleCamera(e) {
      if (e) e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      trackObjects();

      activeBeams.forEach((beam) => {
        beam.smoothTargetX += (beam.targetX - beam.smoothTargetX) * 0.2;
        beam.smoothTargetY += (beam.targetY - beam.smoothTargetY) * 0.2;

        const targetVec = new THREE.Vector3(beam.smoothTargetX, beam.smoothTargetY, beam.targetZ);
        beam.group.lookAt(targetVec);

        beam.mat.opacity = 0.75 + Math.sin(Date.now() * 0.01) * 0.2;
      });

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
