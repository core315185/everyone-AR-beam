<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Multi-Target Expansion</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 14px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
    button.nav-btn.mode { background: #8b5cf6; }
  </style>

  <!-- MediaPipe 各種検出モジュール & Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップして多機能ARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <div id="ui-container">
    <div id="status">画面をタップしてビームを追加してください</div>
    <div class="btn-group">
      <button class="nav-btn mode" onclick="switchTargetMode()">🎯 モード: 手 (Hands)</button>
      <button class="nav-btn" onclick="removeLastBeam()">❌ 選択解除</button>
      <button class="nav-btn danger" onclick="removeAllBeams()">🗑 全削除</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const canvas = document.getElementById('canvas3d');

    let renderer, scene, camera3d;
    let currentFacingMode = 'environment';
    let cameraInstance = null;

    // 追従モード: 'hands' | 'face' | 'pose'
    const targetModes = ['hands', 'face', 'pose'];
    const targetModeLabels = { hands: '手 (Hands)', face: '顔 (Face Mesh)', pose: '全身 (Pose)' };
    let currentModeIndex = 0;

    let activeBeams = [];

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      initDetectors();
      startCamera(currentFacingMode);

      canvas.addEventListener('pointerdown', (e) => {
        if (e.clientY > window.innerHeight - 100) return;

        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = -(e.clientY / window.innerHeight) * 2 + 1;

        const aspect = window.innerWidth / window.innerHeight;
        const worldX = normX * 5 * aspect;
        const worldY = normY * 5;

        const beam = createBeamObject(worldX, worldY, 0, worldX, worldY, -20);
        activeBeams.push(beam);

        statusEl.textContent = `⚡ ビーム追加 (合計: ${activeBeams.length}本)`;
      });

      animate();
    }

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.z = 10;
    }

    function createBeamObject(startX, startY, startZ, targetX, targetY, targetZ) {
      const group = new THREE.Group();

      const geo = new THREE.CylinderGeometry(0.2, 0.03, 30, 16);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, -15);

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const beamMesh = new THREE.Mesh(geo, outerMat);

      const coreGeo = new THREE.CylinderGeometry(0.06, 0.01, 30, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -15);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      group.add(beamMesh);
      group.add(coreMesh);
      scene.add(group);

      return {
        group: group,
        mat: outerMat,
        startX: startX, startY: startY, startZ: startZ,
        targetX: targetX, targetY: targetY, targetZ: targetZ,
        smoothStartX: startX, smoothStartY: startY, smoothStartZ: startZ,
        smoothTargetX: targetX, smoothTargetY: targetY, smoothTargetZ: targetZ
      };
    }

    function removeLastBeam() {
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.group);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    }

    function removeAllBeams() {
      activeBeams.forEach(b => scene.remove(b.group));
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    }

    // --------------------------------------------------
    // 各種AI検出ロジック (Hands, Face Mesh, Pose)
    // --------------------------------------------------
    let handsDetector, faceMeshDetector, poseDetector;

    function initDetectors() {
      // 1. Hands
      handsDetector = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
      handsDetector.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      handsDetector.onResults(onHandsResults);

      // 2. Face Mesh
      faceMeshDetector = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
      faceMeshDetector.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      faceMeshDetector.onResults(onFaceResults);

      // 3. Pose
      poseDetector = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
      poseDetector.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      poseDetector.onResults(onPoseResults);
    }

    function updateTargetBeamVector(startX, startY, startZ, targetX, targetY, targetZ) {
      if (activeBeams.length > 0) {
        const currentBeam = activeBeams[activeBeams.length - 1];
        currentBeam.startX = startX; currentBeam.startY = startY; currentBeam.startZ = startZ;
        currentBeam.targetX = targetX; currentBeam.targetY = targetY; currentBeam.targetZ = targetZ;
      }
    }

    // 手の検出コールバック
    function onHandsResults(results) {
      if (targetModes[currentModeIndex] !== 'hands') return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        const wrist = lm[0], tip = lm[8];
        const isUser = (currentFacingMode === 'user');
        const aspect = window.innerWidth / window.innerHeight;

        const sX = ((isUser ? 1 - wrist.x : wrist.x) - 0.5) * 10 * aspect;
        const sY = (0.5 - wrist.y) * 10;
        const sZ = -wrist.z * 10;

        const tX = ((isUser ? 1 - tip.x : tip.x) - 0.5) * 10 * aspect;
        const tY = (0.5 - tip.y) * 10;
        
        const dirX = tX - sX, dirY = tY - sY;
        updateTargetBeamVector(sX, sY, sZ, sX + dirX * 4, sY + dirY * 4, -20);
        statusEl.textContent = '🎯 【手】指先と傾きに追従中';
      }
    }

    // 顔の検出コールバック
    function onFaceResults(results) {
      if (targetModes[currentModeIndex] !== 'face') return;
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const lm = results.multiFaceLandmarks[0];
        const nose = lm[1], chin = lm[152]; // 鼻先と顎
        const isUser = (currentFacingMode === 'user');
        const aspect = window.innerWidth / window.innerHeight;

        const sX = ((isUser ? 1 - nose.x : nose.x) - 0.5) * 10 * aspect;
        const sY = (0.5 - nose.y) * 10;
        const sZ = 0;

        const cX = ((isUser ? 1 - chin.x : chin.x) - 0.5) * 10 * aspect;
        const cY = (0.5 - chin.y) * 10;

        const dirX = sX - cX, dirY = sY - cY;
        updateTargetBeamVector(sX, sY, sZ, sX + dirX * 5, sY + dirY * 5, -20);
        statusEl.textContent = '🎯 【顔】顔の向き・傾きに追従中';
      }
    }

    // ポーズの検出コールバック
    function onPoseResults(results) {
      if (targetModes[currentModeIndex] !== 'pose') return;
      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;
        const shoulder = lm[12], wrist = lm[16]; // 右肩と右手首
        const isUser = (currentFacingMode === 'user');
        const aspect = window.innerWidth / window.innerHeight;

        const sX = ((isUser ? 1 - shoulder.x : shoulder.x) - 0.5) * 10 * aspect;
        const sY = (0.5 - shoulder.y) * 10;
        const sZ = 0;

        const wX = ((isUser ? 1 - wrist.x : wrist.x) - 0.5) * 10 * aspect;
        const wY = (0.5 - wrist.y) * 10;

        const dirX = wX - sX, dirY = wY - sY;
        updateTargetBeamVector(sX, sY, sZ, sX + dirX * 3, sY + dirY * 3, -20);
        statusEl.textContent = '🎯 【全身】腕の振りとボディラインに追従中';
      }
    }

    function switchTargetMode() {
      currentModeIndex = (currentModeIndex + 1) % targetModes.length;
      const modeKey = targetModes[currentModeIndex];
      const btn = document.querySelector('.nav-btn.mode');
      btn.textContent = `🎯 モード: ${targetModeLabels[modeKey]}`;
      statusEl.textContent = `モード切替: ${targetModeLabels[modeKey]}`;
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          const mode = targetModes[currentModeIndex];
          if (mode === 'hands' && handsDetector) await handsDetector.send({ image: videoElement });
          else if (mode === 'face' && faceMeshDetector) await faceMeshDetector.send({ image: videoElement });
          else if (mode === 'pose' && poseDetector) await poseDetector.send({ image: videoElement });
        },
        width: 640, height: 480, facingMode: facingMode
      });

      cameraInstance.start();
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      activeBeams.forEach((beam) => {
        beam.smoothStartX += (beam.startX - beam.smoothStartX) * 0.25;
        beam.smoothStartY += (beam.startY - beam.smoothStartY) * 0.25;
        beam.smoothStartZ += (beam.startZ - beam.smoothStartZ) * 0.25;

        beam.smoothTargetX += (beam.targetX - beam.smoothTargetX) * 0.25;
        beam.smoothTargetY += (beam.targetY - beam.smoothTargetY) * 0.25;
        beam.smoothTargetZ += (beam.targetZ - beam.smoothTargetZ) * 0.25;

        beam.group.position.set(beam.smoothStartX, beam.smoothStartY, beam.smoothStartZ);

        const targetVec = new THREE.Vector3(beam.smoothTargetX, beam.smoothTargetY, beam.smoothTargetZ);
        beam.group.lookAt(targetVec);

        beam.mat.opacity = 0.75 + Math.sin(Date.now() * 0.01) * 0.15;
      });

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
