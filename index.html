<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    /* --------------------------------------------------
       1. スタート（ビーム選択）画面
    -------------------------------------------------- */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      padding: 24px;
      text-align: center;
    }

    #start-screen h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #start-screen p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .select-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 320px;
    }

    .beam-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .beam-card:active {
      transform: scale(0.96);
    }

    .beam-card.red { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    .beam-card.blue { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    .beam-card.green { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

    /* --------------------------------------------------
       2. ARカメラ画面
    -------------------------------------------------- */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    #ui-container {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
    }

    .title-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 3;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-tag span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    #status {
      color: #e2e8f0;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 8px;
      display: flex;
      gap: 8px;
    }

    button.nav-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-screen">
    <h1>Everyone AR Beam</h1>
    <p>発射したいビームのタイプを選んでください</p>
    
    <div class="select-grid">
      <div class="beam-card red" onclick="startApp('red')">
        <span>🔴 レッドレーザー</span>
        <span>▶</span>
      </div>
      <div class="beam-card blue" onclick="startApp('blue')">
        <span>⚡ プラズマブルー</span>
        <span>▶</span>
      </div>
      <div class="beam-card green" onclick="startApp('green')">
        <span>🟢 プラズマグリーン</span>
        <span>▶</span>
      </div>
    </div>
  </div>

  <div class="title-tag">
    <span></span> ARビーム実行中
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <div id="ui-container">
    <div id="status">カメラを読み込んでいます...</div>
    <div class="panel">
      <button class="nav-btn" onclick="backToMenu()">⚙ ビーム変更</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    let currentFacingMode = 'user';
    let cameraInstance = null;
    let activeBeamType = 'red';
    let audioCtx = null;
    let beamSoundNode = null;
    let beamGainNode = null;

    const beamStyles = {
      red:   { color: 0xff1100, coreColor: 0xffffff, pitch: 300 },
      blue:  { color: 0x00d2ff, coreColor: 0xe0ffff, pitch: 450 },
      green: { color: 0x00ff66, coreColor: 0xffffff, pitch: 220 }
    };

    const statusEl = document.getElementById('status');
    const videoElement = document.getElementById('webcam');
    const startScreen = document.getElementById('start-screen');

    // --------------------------------------------------
    // Web Audio API (効果音)
    // --------------------------------------------------
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startBeamSound() {
      initAudio();
      if (beamSoundNode) return;

      const style = beamStyles[activeBeamType];
      beamSoundNode = audioCtx.createOscillator();
      beamGainNode = audioCtx.createGain();

      beamSoundNode.type = 'sawtooth';
      beamSoundNode.frequency.setValueAtTime(style.pitch, audioCtx.currentTime);

      beamGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
      beamGainNode.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);

      beamSoundNode.connect(beamGainNode);
      beamGainNode.connect(audioCtx.destination);
      beamSoundNode.start();
    }

    function stopBeamSound() {
      if (beamSoundNode && beamGainNode) {
        beamGainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => {
          if (beamSoundNode) {
            beamSoundNode.stop();
            beamSoundNode.disconnect();
            beamSoundNode = null;
            beamGainNode = null;
          }
        }, 100);
      }
    }

    // --------------------------------------------------
    // Three.js 3D描画
    // --------------------------------------------------
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3d.position.z = 5;

    const beamGroup = new THREE.Group();

    // ★修正: オーラ（円柱をZ軸方向へ伸ばす）
    const outerGeo = new THREE.CylinderGeometry(0.06, 0.015, 10, 16);
    outerGeo.rotateX(-Math.PI / 2);
    outerGeo.translate(0, 0, 5);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0xff1100, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);

    // ★修正: コア（円柱をZ軸方向へ伸ばす）
    const innerGeo = new THREE.CylinderGeometry(0.025, 0.005, 10, 16);
    innerGeo.rotateX(-Math.PI / 2);
    innerGeo.translate(0, 0, 5);
    const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
    const innerMesh = new THREE.Mesh(innerGeo, innerMat);

    // 発射リング
    const ringGeo = new THREE.RingGeometry(0.05, 0.1, 16);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);

    beamGroup.add(outerMesh);
    beamGroup.add(innerMesh);
    beamGroup.add(ringMesh);
    beamGroup.visible = false;
    scene.add(beamGroup);

    function applyBeamStyle(type) {
      activeBeamType = type;
      const style = beamStyles[type];
      outerMat.color.setHex(style.color);
      innerMat.color.setHex(style.coreColor);
      ringMat.color.setHex(style.color);
    }

    // --------------------------------------------------
    // MediaPipe Hands (手認識)
    // --------------------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusEl.textContent = '指先を認識中 ⚡ (ビーム発射中)';
        const landmarks = results.multiHandLandmarks[0];

        // 8番: 人差し指先端, 5番: 人差し指付け根
        const tip = landmarks[8];
        const base = landmarks[5];

        const isUser = (currentFacingMode === 'user');
        const rawTipX = isUser ? (1 - tip.x) : tip.x;
        const rawBaseX = isUser ? (1 - base.x) : base.x;

        const aspect = window.innerWidth / window.innerHeight;
        const tipX = (rawTipX - 0.5) * 4 * aspect;
        const tipY = (0.5 - tip.y) * 4;
        const tipZ = -tip.z * 4;

        const baseX = (rawBaseX - 0.5) * 4 * aspect;
        const baseY = (0.5 - base.y) * 4;
        const baseZ = -base.z * 4;

        beamGroup.position.set(tipX, tipY, tipZ);

        // ★修正: 付け根 → 指先に向かう方向を計算
        const dir = new THREE.Vector3(tipX - baseX, tipY - baseY, tipZ - baseZ).normalize();
        const targetPos = new THREE.Vector3().addVectors(beamGroup.position, dir);
        
        beamGroup.lookAt(targetPos);

        beamGroup.visible = true;
        startBeamSound();
      } else {
        statusEl.textContent = 'カメラに手をかざしてください';
        beamGroup.visible = false;
        stopBeamSound();
      }
    });

    // --------------------------------------------------
    // アプリ・カメラ制御フロー
    // --------------------------------------------------
    function startApp(beamType) {
      applyBeamStyle(beamType);
      startScreen.style.display = 'none';
      initAudio();
      startCamera(currentFacingMode);
    }

    function backToMenu() {
      if (cameraInstance) cameraInstance.stop();
      beamGroup.visible = false;
      stopBeamSound();
      startScreen.style.display = 'flex';
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();

      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: facingMode
      });

      cameraInstance.start().then(() => {
        statusEl.textContent = 'カメラ準備完了！手をかざしてください';
      }).catch((err) => {
        statusEl.textContent = 'カメラ読込失敗: ' + err.message;
      });
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    // レンダリングループ
    function animate() {
      requestAnimationFrame(animate);
      if (beamGroup.visible) {
        const time = Date.now() * 0.015;
        outerMat.opacity = 0.5 + Math.sin(time) * 0.2;
        ringMesh.rotation.z += 0.05;
      }
      renderer.render(scene, camera3d);
    }
    animate();

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
