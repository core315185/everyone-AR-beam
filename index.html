<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Universal Object Tracking</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <!-- 物体認識用隠しキャンバス -->
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">人や物（好きな場所）をタップしてビームをロックオン！</div>
    <div class="btn-group">
      <button class="nav-btn" onclick="removeLastBeam()">❌ 1本解除</button>
      <button class="nav-btn danger" onclick="removeAllBeams()">🗑 全削除</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const canvas = document.getElementById('canvas3d');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d');

    let renderer, scene, camera3d;
    let currentFacingMode = 'environment';
    let cameraStream = null;

    let activeBeams = [];

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      startCamera(currentFacingMode);

      // タップした場所（人・物問わず）を追従対象に登録
      canvas.addEventListener('pointerdown', (e) => {
        if (e.clientY > window.innerHeight - 80) return;

        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;

        // 映像内ピクセル位置
        const videoX = (clientX / window.innerWidth) * processCanvas.width;
        const videoY = (clientY / window.innerHeight) * processCanvas.height;

        // 3D空間のXY座標（カメラ前方の位置）
        const aspect = window.innerWidth / window.innerHeight;
        const normX = (clientX / window.innerWidth) * 2 - 1;
        const normY = -(clientY / window.innerHeight) * 2 + 1;
        const worldX = normX * 5 * aspect;
        const worldY = normY * 5;

        // テンプレート画像の保存（物体追従用）
        const templateSize = 30;
        const templateData = pCtx.getImageData(
          Math.max(0, videoX - templateSize/2),
          Math.max(0, videoY - templateSize/2),
          templateSize, templateSize
        );

        const beam = createBeamObject(worldX, worldY, videoX, videoY, templateData);
        activeBeams.push(beam);

        statusEl.textContent = `🎯 対象物をロックオン！ (合計: ${activeBeams.length}本)`;
      });

      animate();
    }

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.z = 10;
    }

    function createBeamObject(worldX, worldY, videoX, videoY, templateData) {
      const group = new THREE.Group();

      // ★ 向きの修正：伸ばす方向（translate）をZ軸マイナス（カメラ奥）に変更
      const geo = new THREE.CylinderGeometry(0.2, 0.03, 30, 16);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, -15); // 根本から奥方向へ伸ばす

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const beamMesh = new THREE.Mesh(geo, outerMat);

      const coreGeo = new THREE.CylinderGeometry(0.06, 0.01, 30, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -15);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      group.add(beamMesh);
      group.add(coreMesh);

      // 初期位置（画面下端からの発射）と向きの設定
      group.position.set(0, -5, 2); 
      const targetVec = new THREE.Vector3(worldX, worldY, -10);
      group.lookAt(targetVec);

      scene.add(group);

      return {
        group: group,
        mat: outerMat,
        worldX: worldX, worldY: worldY,
        smoothWorldX: worldX, smoothWorldY: worldY,
        videoX: videoX, videoY: videoY,
        template: templateData
      };
    }

    function removeLastBeam() {
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.group);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    }

    function removeAllBeams() {
      activeBeams.forEach(b => scene.remove(b.group));
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    }

    // --------------------------------------------------
    // 人・物問わずリアルタイムで追従するアルゴリズム（テンプレートマッチング）
    // --------------------------------------------------
    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState !== 4) return;

      processCanvas.width = 320;
      processCanvas.height = 240;
      pCtx.drawImage(videoElement, 0, 0, processCanvas.width, processCanvas.height);

      const frame = pCtx.getImageData(0, 0, processCanvas.width, processCanvas.height);
      const searchRadius = 25; // 探索範囲

      activeBeams.forEach(beam => {
        if (!beam.template) return;

        let bestX = beam.videoX;
        let bestY = beam.videoY;
        let minDiff = Infinity;

        const tW = beam.template.width;
        const tH = beam.template.height;
        const tData = beam.template.data;

        // タップされた位置の周辺ピクセルパターンを高速スキャン
        for (let dy = -searchRadius; dy <= searchRadius; dy += 3) {
          for (let dx = -searchRadius; dx <= searchRadius; dx += 3) {
            const curX = Math.floor(beam.videoX + dx);
            const curY = Math.floor(beam.videoY + dy);

            if (curX < 0 || curX >= processCanvas.width - tW || curY < 0 || curY >= processCanvas.height - tH) continue;

            let diff = 0;
            for (let i = 0; i < tData.length; i += 12) { // 軽量スキャン
              const fIdx = ((curY + Math.floor((i/4)/tW)) * processCanvas.width + (curX + ((i/4)%tW))) * 4;
              diff += Math.abs(frame.data[fIdx] - tData[i]) + Math.abs(frame.data[fIdx+1] - tData[i+1]) + Math.abs(frame.data[fIdx+2] - tData[i+2]);
            }

            if (diff < minDiff) {
              minDiff = diff;
              bestX = curX;
              bestY = curY;
            }
          }
        }

        // 新しい位置を更新
        beam.videoX = bestX;
        beam.videoY = bestY;

        // 3D座標へ変換
        const aspect = window.innerWidth / window.innerHeight;
        const normX = (bestX / processCanvas.width) * 2 - 1;
        const normY = -(bestY / processCanvas.height) * 2 + 1;
        beam.worldX = normX * 5 * aspect;
        beam.worldY = normY * 5;
      });
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      trackObjects();

      activeBeams.forEach((beam) => {
        // 対象物への吸い付き（ローパスフィルター）
        beam.smoothWorldX += (beam.worldX - beam.smoothWorldX) * 0.2;
        beam.smoothWorldY += (beam.worldY - beam.smoothWorldY) * 0.2;

        // 発射位置（画面下）からタップした物体（奥）へ正しく照射
        beam.group.position.set(0, -5, 2);
        const targetVec = new THREE.Vector3(beam.smoothWorldX, beam.smoothWorldY, -10);
        beam.group.lookAt(targetVec);

        beam.mat.opacity = 0.75 + Math.sin(Date.now() * 0.01) * 0.15;
      });

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
