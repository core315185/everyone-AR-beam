<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - 3D 3-Axis Motion Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
      pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">👆 タップして3D ARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">画面上の人や物をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
      <button class="nav-btn" id="cam-btn">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    let currentFacingMode = 'environment';
    let cameraStream = null;
    let activeBeams = [];

    const PROC_W = 320;
    const PROC_H = 240;
    const TEMP_SIZE = 24;

    let scene, camera, renderer;
    const Z_PLANE = -12;

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    function create3DBeamMesh() {
      const group = new THREE.Group();

      // 1. 外側ビーム（3Dシリンダー）
      const outerGeo = new THREE.CylinderGeometry(0.2, 0.05, 1, 16);
      outerGeo.translate(0, 0.5, 0); // 原点を底面に
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
      });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      group.add(outerMesh);

      // 2. 内側ビーム（白い芯）
      const innerGeo = new THREE.CylinderGeometry(0.08, 0.02, 1, 12);
      innerGeo.translate(0, 0.5, 0);
      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      const innerMesh = new THREE.Mesh(innerGeo, innerMat);
      group.add(innerMesh);

      // 3. 3D ロックオンリング
      const ringGeo = new THREE.RingGeometry(0.25, 0.32, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      group.add(ringMesh);

      // 4. 先端スパークパーティクル
      const pCount = 35;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];

      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3(
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1
        ));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.09, transparent: true, blending: THREE.AdditiveBlending
      });
      const particleSystem = new THREE.Points(pGeo, pMat);
      group.add(particleSystem);

      scene.add(group);

      return { group, outerMesh, innerMesh, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      init3D();
      startCamera(currentFacingMode);
      animate();
    });

    // 3次元全方位（3面）からのランダムな発生源ポイントを生成
    function calculate3DOrigin(targetX, targetY) {
      const target3D = screenTo3D(targetX, targetY);
      
      // X, Y, Z の3軸全方向に拡散させた3D位置を作成
      const randomDir = new THREE.Vector3(
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20,
        -5 - Math.random() * 25 // 手前〜奥へ深く配置
      );

      return target3D.clone().add(randomDir);
    }

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      let templateData = null;
      let videoX = 0, videoY = 0;

      if (videoElement.readyState >= 2) {
        try {
          processCanvas.width = PROC_W;
          processCanvas.height = PROC_H;
          pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
          
          videoX = (clientX / window.innerWidth) * PROC_W;
          videoY = (clientY / window.innerHeight) * PROC_H;

          const startX = Math.max(0, Math.min(PROC_W - TEMP_SIZE, videoX - TEMP_SIZE / 2));
          const startY = Math.max(0, Math.min(PROC_H - TEMP_SIZE, videoY - TEMP_SIZE / 2));

          templateData = pCtx.getImageData(startX, startY, TEMP_SIZE, TEMP_SIZE);
        } catch (err) {}
      }

      const origin3D = calculate3DOrigin(clientX, clientY);
      const meshData = create3DBeamMesh();

      activeBeams.push({
        origin3D: origin3D,
        x: clientX,
        y: clientY,
        smoothX: clientX,
        smoothY: clientY,
        videoX: videoX,
        videoY: videoY,
        template: templateData,
        meshData: meshData
      });

      statusEl.textContent = `⚡ 3面立体ビーム発射！ (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.meshData.group);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => scene.remove(b.meshData.group));
      activeBeams = [];
      statusEl.textContent = '🗑 すべての3Dビームを削除しました';
    });

    document.getElementById('cam-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    });

    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      try {
        processCanvas.width = PROC_W;
        processCanvas.height = PROC_H;
        pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
        const frame = pCtx.getImageData(0, 0, PROC_W, PROC_H);

        activeBeams.forEach(beam => {
          if (!beam.template) return;

          const tData = beam.template.data;
          let bestX = beam.videoX;
          let bestY = beam.videoY;
          let minDiff = Infinity;

          for (let dy = -36; dy <= 36; dy += 6) {
            for (let dx = -36; dx <= 36; dx += 6) {
              const curX = Math.floor(beam.videoX + dx);
              const curY = Math.floor(beam.videoY + dy);
              if (curX < 0 || curX >= PROC_W - TEMP_SIZE || curY < 0 || curY >= PROC_H - TEMP_SIZE) continue;

              let diff = 0;
              for (let i = 0; i < tData.length; i += 16) {
                const px = (i / 4) % TEMP_SIZE;
                const py = Math.floor((i / 4) / TEMP_SIZE);
                const fIdx = ((curY + py) * PROC_W + (curX + px)) * 4;
                diff += Math.abs(frame.data[fIdx] - tData[i]) +
                        Math.abs(frame.data[fIdx + 1] - tData[i + 1]) +
                        Math.abs(frame.data[fIdx + 2] - tData[i + 2]);
              }
              if (diff < minDiff) {
                minDiff = diff;
                bestX = curX;
                bestY = curY;
              }
            }
          }

          if (minDiff < 40000) {
            beam.videoX = bestX;
            beam.videoY = bestY;
            beam.x = (bestX / PROC_W) * window.innerWidth;
            beam.y = (bestY / PROC_H) * window.innerHeight;
          }
        });
      } catch (err) {}
    }

    async function startCamera(facingMode) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    const defaultUp = new THREE.Vector3(0, 1, 0); // シリンダーの初期方向（Y軸）

    function animate() {
      requestAnimationFrame(animate);

      trackObjects();

      activeBeams.forEach((beam) => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.4;
        beam.smoothY += (beam.y - beam.smoothY) * 0.4;

        const start3D = beam.origin3D;
        const target3D = screenTo3D(beam.smoothX, beam.smoothY);

        const { outerMesh, innerMesh, ringMesh, particleSystem, pVel } = beam.meshData;

        // 3D空間上の方向ベクトルと距離の計算
        const dir = new THREE.Vector3().subVectors(target3D, start3D);
        const distance = dir.length();
        dir.normalize();

        // 3軸（X, Y, Z）に合わせた全方位回転クォータニオン計算
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(defaultUp, dir);

        // 位置・回転・スケールの適用
        outerMesh.position.copy(start3D);
        outerMesh.quaternion.copy(quaternion);
        outerMesh.scale.set(1, distance, 1);

        innerMesh.position.copy(start3D);
        innerMesh.quaternion.copy(quaternion);
        innerMesh.scale.set(1, distance, 1);

        // ロックオンリングをターゲット位置へ（ターゲット方向に向けて回転）
        ringMesh.position.copy(target3D);
        ringMesh.quaternion.copy(quaternion);
        ringMesh.rotateX(Math.PI / 2); // リング面をビームと直角に
        ringMesh.rotation.z += 0.04;
        const scalePulse = 1 + Math.sin(Date.now() * 0.01) * 0.2;
        ringMesh.scale.set(scalePulse, scalePulse, scalePulse);

        // 先端3Dスパーク粒子のアニメーション
        particleSystem.position.copy(target3D);
        const positions = particleSystem.geometry.attributes.position.array;

        for (let i = 0; i < pVel.length; i++) {
          positions[i*3] += pVel[i].x;
          positions[i*3+1] += pVel[i].y;
          positions[i*3+2] += pVel[i].z;

          if (Math.abs(positions[i*3]) > 0.5 || Math.abs(positions[i*3+1]) > 0.5 || Math.abs(positions[i*3+2]) > 0.5) {
            positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
