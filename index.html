<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Tip Direction Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; pointer-events: none;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10; pointer-events: auto;
    }

    #ui-container {
      position: absolute; bottom: 25px; left: 0; width: 100%; z-index: 20;
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 15px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffff; text-align: center;
      pointer-events: auto; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger { background: #ef4444; }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Pose (骨格検出AI) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" id="start-btn">⚡ AI先端検出 ARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="webgl-canvas"></canvas>
  <canvas id="processCanvas" style="display:none;"></canvas>

  <div id="ui-container">
    <div id="status">手や指先、または物の先端をタップしてください</div>
    <div class="btn-group">
      <button class="nav-btn" id="remove-btn">❌ 1本解除</button>
      <button class="nav-btn danger" id="clear-btn">🗑 全削除</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const canvas3d = document.getElementById('webgl-canvas');
    const processCanvas = document.getElementById('processCanvas');
    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    let cameraStream = null;
    let activeBeams = [];

    const PROC_W = 160;
    const PROC_H = 120;
    const TEMP_SIZE = 16;

    let scene, camera, renderer;
    const Z_PLANE = -10;

    let poseDetector = null;
    let latestPoseLandmarks = null;
    let isPoseProcessing = false;

    function initAI() {
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      poseDetector.onResults((results) => {
        latestPoseLandmarks = results.poseLandmarks || null;
        isPoseProcessing = false;
      });
    }

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function screenTo3D(screenX, screenY, zDepth = Z_PLANE) {
      const ndcX = (screenX / window.innerWidth) * 2 - 1;
      const ndcY = -(screenY / window.innerHeight) * 2 + 1;
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = (zDepth - camera.position.z) / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    function extractLuminance(imageData) {
      const lum = new Float32Array(imageData.width * imageData.height);
      const d = imageData.data;
      for (let i = 0, j = 0; i < d.length; i += 4, j++) {
        lum[j] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      }
      return lum;
    }

    function create3DBeamElements() {
      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const outerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1, 12, 1, true), outerMat);
      scene.add(outerMesh);

      const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const innerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1, 8, 1, true), innerMat);
      scene.add(innerMesh);

      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const ringMesh = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 24), ringMat);
      scene.add(ringMesh);

      const pCount = 15;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pVel = [];
      for(let i = 0; i < pCount; i++) {
        pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
        pVel.push(new THREE.Vector3((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08));
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.08, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      scene.add(particleSystem);

      return { outerMesh, innerMesh, ringMesh, particleSystem, pVel };
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startOverlay.style.display = 'none';
      initAI();
      init3D();
      startCamera();
      animate();
    });

    function handleTap(clientX, clientY) {
      if (startOverlay.style.display !== 'none') return;
      if (clientY > window.innerHeight - 80) return;

      const normX = clientX / window.innerWidth;
      const normY = clientY / window.innerHeight;
      let matchedLandmarkIndex = -1;
      let baseLandmarkIndex = -1;

      // 骨格検知（手首・指先周辺の正確な位置を特定）
      if (latestPoseLandmarks) {
        let minDist = 0.2;
        // 15:右手首, 16:左手首, 19:右手の人差し指先, 20:左手の人差し指先
        const trackedPoints = [
          { tip: 19, base: 15 }, // 右指先と手首
          { tip: 20, base: 16 }, // 左指先と手首
          { tip: 15, base: 13 }, // 右手首と肘
          { tip: 16, base: 14 }  // 左手首と肘
        ];

        trackedPoints.forEach(pt => {
          const lmTip = latestPoseLandmarks[pt.tip];
          if (lmTip && lmTip.visibility > 0.5) {
            const dist = Math.hypot(lmTip.x - normX, lmTip.y - normY);
            if (dist < minDist) {
              minDist = dist;
              matchedLandmarkIndex = pt.tip;
              baseLandmarkIndex = pt.base;
            }
          }
        });
      }

      // 何もない空中の場合は絶対に発火させない（骨格、または物体認識のいずれかが有効な場合のみ）
      if (matchedLandmarkIndex === -1) {
        statusEl.textContent = '⚠️ 指先や物の上をタップしてください';
        return;
      }

      let lumTemplate = null;
      let videoX = 0, videoY = 0;
      if (videoElement.readyState >= 2) {
        try {
          processCanvas.width = PROC_W;
          processCanvas.height = PROC_H;
          pCtx.drawImage(videoElement, 0, 0, PROC_W, PROC_H);
          videoX = (clientX / window.innerWidth) * PROC_W;
          videoY = (clientY / window.innerHeight) * PROC_H;
          const startX = Math.max(0, Math.min(PROC_W - TEMP_SIZE, Math.floor(videoX - TEMP_SIZE / 2)));
          const startY = Math.max(0, Math.min(PROC_H - TEMP_SIZE, Math.floor(videoY - TEMP_SIZE / 2)));
          lumTemplate = extractLuminance(pCtx.getImageData(startX, startY, TEMP_SIZE, TEMP_SIZE));
        } catch (err) {}
      }

      const elements = create3DBeamElements();

      activeBeams.push({
        x: clientX, y: clientY,
        smoothX: clientX, smoothY: clientY,
        videoX: videoX, videoY: videoY,
        vx: 0, vy: 0,
        landmarkIndex: matchedLandmarkIndex,
        baseLandmarkIndex: baseLandmarkIndex,
        lumTemplate: lumTemplate,
        elements: elements
      });

      statusEl.textContent = `🎯 先端をロックオンしました (合計: ${activeBeams.length}本)`;
    }

    canvas3d.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas3d.addEventListener('mousedown', (e) => {
      handleTap(e.clientX, e.clientY);
    });

    document.getElementById('remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.elements.outerMesh);
        scene.remove(lastBeam.elements.innerMesh);
        scene.remove(lastBeam.elements.ringMesh);
        scene.remove(lastBeam.elements.particleSystem);
        statusEl.textContent = `❌ 1本解除 (残り: ${activeBeams.length}本)`;
      }
    });

    document.getElementById('clear-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeBeams.forEach(b => {
        scene.remove(b.elements.outerMesh);
        scene.remove(b.elements.innerMesh);
        scene.remove(b.elements.ringMesh);
        scene.remove(b.elements.particleSystem);
      });
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    });

    function trackObjects() {
      if (activeBeams.length === 0 || videoElement.readyState < 2) return;

      if (poseDetector && !isPoseProcessing) {
        isPoseProcessing = true;
        poseDetector.send({ image: videoElement }).catch(() => { isPoseProcessing = false; });
      }

      activeBeams.forEach(beam => {
        if (beam.landmarkIndex !== -1 && latestPoseLandmarks) {
          const lmTip = latestPoseLandmarks[beam.landmarkIndex];
          if (lmTip && lmTip.visibility > 0.4) {
            beam.x = lmTip.x * window.innerWidth;
            beam.y = lmTip.y * window.innerHeight;
          }
        }
      });
    }

    async function startCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        videoElement.srcObject = cameraStream;
      } catch (e) {
        statusEl.textContent = 'カメラ起動エラー: ' + e.message;
      }
    }

    function alignCylinder(mesh, p1, p2) {
      const midpoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
      const length = p1.distanceTo(p2);
      mesh.position.copy(midpoint);
      mesh.scale.set(1, length, 1);
      mesh.lookAt(p2);
      mesh.rotateX(Math.PI / 2);
    }

    function animate() {
      requestAnimationFrame(animate);
      trackObjects();

      activeBeams.forEach((beam) => {
        beam.smoothX += (beam.x - beam.smoothX) * 0.4;
        beam.smoothY += (beam.y - beam.smoothY) * 0.4;

        // 1. 検出された先端の3D座標
        const tip3D = screenTo3D(beam.smoothX, beam.smoothY, -8);

        // 2. 先端の向いている向き（方向ベクトル）の計算
        let directionVector = new THREE.Vector3(0, 0, -1); // デフォルト（前方）
        if (beam.baseLandmarkIndex !== -1 && latestPoseLandmarks) {
          const lmTip = latestPoseLandmarks[beam.landmarkIndex];
          const lmBase = latestPoseLandmarks[beam.baseLandmarkIndex];
          if (lmTip && lmBase && lmTip.visibility > 0.4 && lmBase.visibility > 0.4) {
            const base3D = screenTo3D(lmBase.x * window.innerWidth, lmBase.y * window.innerHeight, -8);
            // 根元から先端へ向かうベクトル＝先端の向き
            directionVector = new THREE.Vector3().subVectors(tip3D, base3D).normalize();
          }
        } else {
          // 骨格がない場合はカメラ視線方向を基準にする
          directionVector = new THREE.Vector3().subVectors(tip3D, camera.position).normalize();
        }

        // 3. 先端から、その「向いている方向」へ向かってビームを延長
        const extensionLength = 15.0;
        const farEnd3D = tip3D.clone().add(directionVector.multiplyScalar(extensionLength));

        const { outerMesh, innerMesh, ringMesh, particleSystem, pVel } = beam.elements;

        alignCylinder(outerMesh, tip3D, farEnd3D);
        alignCylinder(innerMesh, tip3D, farEnd3D);

        ringMesh.position.copy(tip3D);
        ringMesh.lookAt(camera.position);

        particleSystem.position.copy(tip3D);
        const positions = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < pVel.length; i++) {
          positions[i*3] += pVel[i].x;
          positions[i*3+1] += pVel[i].y;
          positions[i*3+2] += pVel[i].z;
          if (Math.abs(positions[i*3]) > 0.4 || Math.abs(positions[i*3+1]) > 0.4 || Math.abs(positions[i*3+2]) > 0.4) {
            positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      });

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
