<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Everyone AR Beam - Multi Target Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0,0,0,0.9); z-index: 30;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }

    #webcam {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }

    #canvas3d {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 5;
      pointer-events: auto; /* タップイベントを受け取るために変更 */
    }

    #ui-container {
      position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px;
      pointer-events: none;
    }
    #status {
      font-size: 13px; background: rgba(0, 0, 0, 0.85);
      padding: 8px 18px; border-radius: 20px; border: 1px solid #3b82f6; text-align: center;
      pointer-events: auto;
    }
    .btn-group { display: flex; gap: 8px; pointer-events: auto; }
    button.nav-btn {
      background: #3b82f6; color: #fff; border: none;
      padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button.nav-btn.danger {
      background: #ef4444;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="start-overlay">
    <button class="nav-btn" onclick="startApp()">👆 タップしてARを開始</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas3d"></canvas>

  <div id="ui-container">
    <div id="status">画面をタップしてビームを追加してください</div>
    <div class="btn-group">
      <button class="nav-btn" onclick="removeLastBeam()">❌ 選択解除 (1本)</button>
      <button class="nav-btn danger" onclick="removeAllBeams()">🗑 全削除</button>
      <button class="nav-btn" onclick="toggleCamera()">📷 カメラ切替</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const startOverlay = document.getElementById('start-overlay');
    const canvas = document.getElementById('canvas3d');

    let renderer, scene, camera3d;
    let currentFacingMode = 'environment';
    let cameraInstance = null;

    // 複数ビームを管理する配列
    let activeBeams = [];

    function startApp() {
      startOverlay.style.display = 'none';
      initThree();
      initMediaPipe();
      startCamera(currentFacingMode);

      // タップ/クリックで新しいビームを固定・生成するイベント
      canvas.addEventListener('pointerdown', (e) => {
        // UIボタン領域のクリックを弾く
        if (e.clientY > window.innerHeight - 90) return;

        const normX = (e.clientX / window.innerWidth) * 2 - 1;
        const normY = -(e.clientY / window.innerHeight) * 2 + 1;

        const aspect = window.innerWidth / window.innerHeight;
        const worldX = normX * 5 * aspect;
        const worldY = normY * 5;

        // ビームオブジェクトを作成して追加
        const beam = createBeamObject(worldX, worldY);
        activeBeams.push(beam);

        statusEl.textContent = `⚡ ビーム設置完了 (合計: ${activeBeams.length}本)`;
      });

      animate();
    }

    function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera3d.position.z = 10;
    }

    // 3Dビームの生成関数
    function createBeamObject(x, y) {
      const group = new THREE.Group();

      // ビーム本体
      const geo = new THREE.CylinderGeometry(0.25, 0.04, 30, 16);
      geo.rotateX(Math.PI / 2);
      geo.translate(0, 0, -15);

      const outerMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const beamMesh = new THREE.Mesh(geo, outerMat);

      // 芯（ホワイトコア）
      const coreGeo = new THREE.CylinderGeometry(0.08, 0.015, 30, 16);
      coreGeo.rotateX(Math.PI / 2);
      coreGeo.translate(0, 0, -15);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      group.add(beamMesh);
      group.add(coreMesh);

      // 初期位置とターゲットの設定
      group.position.set(x, y, 0);

      // 手前（タップ位置）から奥へ向けて照射する角度の初期化
      const targetVec = new THREE.Vector3(x, y, -20);
      group.lookAt(targetVec);

      scene.add(group);

      return {
        group: group,
        mat: outerMat,
        targetX: x,
        targetY: y,
        smoothX: x,
        smoothY: y
      };
    }

    // 最後に追加したビームを解除
    function removeLastBeam() {
      if (activeBeams.length > 0) {
        const lastBeam = activeBeams.pop();
        scene.remove(lastBeam.group);
        statusEl.textContent = `❌ 1本解除しました (残り: ${activeBeams.length}本)`;
      } else {
        statusEl.textContent = '解除できるビームはありません';
      }
    }

    // すべてのビームを一括解除
    function removeAllBeams() {
      activeBeams.forEach(b => scene.remove(b.group));
      activeBeams = [];
      statusEl.textContent = '🗑 すべてのビームを削除しました';
    }

    // MediaPipe Hands (かざした手の指先に合わせて最新のビーム位置を更新)
    let hands = null;
    function initMediaPipe() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const tip = landmarks[8];

          const isUser = (currentFacingMode === 'user');
          const rawX = isUser ? (1 - tip.x) : tip.x;

          const normX = (rawX - 0.5) * 2;
          const normY = (0.5 - tip.y) * 2;

          const aspect = window.innerWidth / window.innerHeight;
          const targetX = normX * 5 * aspect;
          const targetY = normY * 5;

          // 手が認識された場合、最後に設置したビームの位置と角度を動的に更新
          if (activeBeams.length > 0) {
            const currentBeam = activeBeams[activeBeams.length - 1];
            currentBeam.targetX = targetX;
            currentBeam.targetY = targetY;
          }
        }
      });
    }

    function startCamera(facingMode) {
      if (cameraInstance) cameraInstance.stop();
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          if (hands) await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        facingMode: facingMode
      });

      cameraInstance.start();
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera(currentFacingMode);
    }

    function animate() {
      requestAnimationFrame(animate);

      // 全ての活性化ビームの描画更新
      activeBeams.forEach((beam) => {
        // 位置のなめらか移動（角度追従）
        beam.smoothX += (beam.targetX - beam.smoothX) * 0.2;
        beam.smoothY += (beam.targetY - beam.smoothY) * 0.2;

        beam.group.position.set(beam.smoothX, beam.smoothY, 0);

        // カメラ奥に向ける回転角度の追従計算
        const targetVec = new THREE.Vector3(beam.smoothX, beam.smoothY, -20);
        beam.group.lookAt(targetVec);

        // パルス（点滅）エフェクト
        beam.mat.opacity = 0.75 + Math.sin(Date.now() * 0.01) * 0.15;
      });

      renderer.render(scene, camera3d);
    }

    window.addEventListener('resize', () => {
      camera3d.aspect = window.innerWidth / window.innerHeight;
      camera3d.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
